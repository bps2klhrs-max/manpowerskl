async function checkHealthCertConflicts(workerIds, planDate, planEndDate) {
  const checkDateStr = planEndDate || planDate;
  if (!checkDateStr || !workerIds.length) return [];
  const idList = workerIds.map(id => `"${id}"`).join(',');
  const rows = await supa(`/rest/v1/v_workers_status?select=id,name,dlog_exp_date,osp_exp_date,mcu_exp_date&id=in.(${idList})`);
  const checkDate = new Date(checkDateStr);
  const bad = [];
  rows.forEach(w => {
    const dlogBad = w.dlog_exp_date && new Date(w.dlog_exp_date) < checkDate;
    const ospBad = w.osp_exp_date && new Date(w.osp_exp_date) < checkDate;
    const mcuMissing = !w.mcu_exp_date;
    const mcuExpired = w.mcu_exp_date && new Date(w.mcu_exp_date) < checkDate;
    if (dlogBad || ospBad || mcuMissing || mcuExpired) {
      const reasons = [];
      if (dlogBad) reasons.push('D-log หมดอายุ ' + fmtDate(w.dlog_exp_date));
      if (ospBad) reasons.push('OSP หมดอายุ ' + fmtDate(w.osp_exp_date));
      if (mcuMissing) reasons.push('ยังไม่มี MCU');
      if (mcuExpired) reasons.push('MCU หมดอายุ ' + fmtDate(w.mcu_exp_date));
      bad.push(`${w.name} (${reasons.join(', ')})`);
    }
  });
  return bad;
}
async function saveTrainingConfirmed(recordId) {
  const courseId = document.getElementById('tc-course').value;
  const clientSel = document.getElementById('tc-client').value;
  const planDate = document.getElementById('tc-plandate').value || null;
  const basePayload = {
    course_id: courseId ? Number(courseId) : null,
    custom_course_name: courseId ? null : (document.getElementById('tc-custom-name').value.trim() || null),
    client_tag: clientSel === 'อื่นๆ' ? (document.getElementById('tc-client-custom').value.trim() || null) : (clientSel || null),
    training_company: document.getElementById('tc-company').value.trim() || null,
    location: document.getElementById('tc-location').value.trim() || null,
    plan_date: planDate,
    plan_end_date: document.getElementById('tc-planend').value || null,
    remark: document.getElementById('tc-remark').value.trim() || null,
    selected_sub_options: collectSubOptions('tc'),
  };
  if (!basePayload.plan_date) { toast('กรุณาระบุวันที่วางแผน', 'err'); return; }

  const workerSel = document.getElementById('tc-worker');
  const workerIds = recordId
    ? [workerSel.value]
    : Array.from(workerSel.selectedOptions).map(o => o.value);
  if (!workerIds.length) { toast('กรุณาเลือกพนักงานอย่างน้อย 1 คน', 'err'); return; }

  const conflicts = await checkHealthCertConflicts(workerIds, planDate, basePayload.plan_end_date);
  if (conflicts.length) {
    toast('⚠️ ไม่สามารถวางแผนได้ ใบสุขภาพของ: ' + conflicts.join(' | '), 'err');
    return;
  }

  try {
    if (recordId) {
      await supa('/rest/v1/worker_training_records?id=eq.' + recordId, { method: 'PATCH', body: JSON.stringify(basePayload) });
      toast('แก้ไขแผนอบรมแล้ว');
    } else {
      const rows = workerIds.map(wid => ({ ...basePayload, worker_id: wid }));
      await supa('/rest/v1/worker_training_records', { method: 'POST', headers: { Prefer: 'return=minimal' }, body: JSON.stringify(rows) });
      toast(`บันทึกแผนอบรมให้ ${workerIds.length} คนแล้ว`);
    }
    closeAllOverlays();
    renderTraining();
  } catch (e) { toast('บันทึกไม่สำเร็จ: ' + e.message, 'err'); }
}

/* ---- jobs about to start (within 14 days) ----
   Pops up when the page is opened (once per browser session; the 🔔 button reopens it any time).
   "เตือนอีกครั้งวันที่" stores a date on the project (shared by the team); the popup stays quiet for that
   job until that date. Viewer accounts can't write to the database, so their choice is kept in this browser. */
const PROJECT_START_ALERT_DAYS = 14;
const PRE_MOB_FLAGS = ['booking_mob', 'document_sse', 'e_mob', 'sop', 'cv', 'training_record'];
function localToday() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }
function daysBetweenIso(a, b) { const [ay, am, ad] = a.split('-').map(Number), [by, bm, bd] = b.split('-').map(Number); return Math.round((Date.UTC(by, bm - 1, bd) - Date.UTC(ay, am - 1, ad)) / 86400000); }
function addDaysIso(iso, n) { const [y, m, d] = iso.split('-').map(Number); const t = new Date(Date.UTC(y, m - 1, d + n)); return t.toISOString().slice(0, 10); }
function localSnoozeMap() { try { return JSON.parse(localStorage.getItem('bpe_proj_snooze_v1') || '{}'); } catch (e) { return {}; } }
function projectSnoozeDate(p) { return p.remind_again_date || localSnoozeMap()[p.id] || null; }
function getUpcomingStartProjects(includeSnoozed) {
  const today = localToday();
  return (window._allProjects || []).filter(p => {
    if (!p.mob_date) return false;
    const days = daysBetweenIso(today, p.mob_date);
    if (days < 0 || days > PROJECT_START_ALERT_DAYS) return false;
    const snooze = projectSnoozeDate(p);
    return includeSnoozed || !snooze || snooze <= today;
  }).sort((a, b) => a.mob_date.localeCompare(b.mob_date));
}
function startInText(days) { return days === 0 ? 'เริ่มวันนี้' : `อีก ${days} วัน`; }
async function maybeShowProjectStartPopup() {
  if (sessionStorage.getItem('bpe_proj_popup_seen') === localToday()) return;
  if (!getUpcomingStartProjects(false).length) return;
  sessionStorage.setItem('bpe_proj_popup_seen', localToday());
  await showProjectStartPopup(false);
}
async function showProjectStartPopup(includeSnoozed) {
  const list = getUpcomingStartProjects(!!includeSnoozed);
  if (!list.length) { toast('ไม่มีงานที่จะเริ่มภายใน ' + PROJECT_START_ALERT_DAYS + ' วัน'); return; }
  const today = localToday(), tomorrow = addDaysIso(today, 1);
  // how ready each job is: workers whose pre-Mob checklist (Booking Mob, SSE, E-Mob, SOP, CV, Training Record) is fully ticked
  let allocs = [];
  try { allocs = await supaAll(`/rest/v1/worker_project_allocations?select=project_id,worker_id,${PRE_MOB_FLAGS.join(',')}&project_id=in.(${list.map(p => p.id).join(',')})`); } catch (e) { /* popup still works without it */ }
  const card = p => {
    const days = daysBetweenIso(today, p.mob_date);
    const mine = allocs.filter(a => a.project_id === p.id);
    const ready = mine.filter(a => PRE_MOB_FLAGS.every(k => a[k])).length;
    const snooze = projectSnoozeDate(p);
    const urgent = days <= 3;
    return `<div class="proj-start-card" id="psc-${p.id}">
      <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:flex-start;">
        <div>
          <div style="font-weight:800;color:var(--navy-900);">${esc(p.project_name)}</div>

async function setProjectSnooze(projectId, date, quiet) {
  const p = (window._allProjects || []).find(x => x.id === projectId);
  if (!p) return false;
  const today = localToday();
  if (!date) { toast('กรุณาเลือกวันที่ที่จะให้เตือนอีกครั้ง', 'err'); return false; }
  if (date <= today) { toast('วันที่เตือนอีกครั้งต้องเป็นวันหลังจากวันนี้', 'err'); return false; }
  if (date > p.mob_date) { toast('ควรเตือนก่อนวัน Mob (' + fmtDate(p.mob_date) + ')', 'err'); return false; }
  try {
    if (isAdmin()) {
      await supa(`/rest/v1/projects?id=eq.${projectId}`, { method: 'PATCH', body: JSON.stringify({ remind_again_date: date }) });
      p.remind_again_date = date;
    } else { const map = localSnoozeMap(); map[projectId] = date; localStorage.setItem('bpe_proj_snooze_v1', JSON.stringify(map)); }
  } catch (e) { toast('ตั้งเตือนไม่สำเร็จ: ' + e.message, 'err'); return false; }
  const cardEl = document.getElementById('psc-' + projectId);
  if (cardEl) cardEl.remove();
  window._startPopupIds = (window._startPopupIds || []).filter(id => id !== projectId);
  if (!quiet) toast('จะเตือนอีกครั้งวันที่ ' + fmtDate(date));
  if (!quiet && !(window._startPopupIds || []).length) closeAllOverlays();
  return true;
}
async function setAllProjectSnooze() {
  const date = document.getElementById('snooze-all').value;
  const ids = [...(window._startPopupIds || [])];
  let ok = 0;
  for (const id of ids) { if (await setProjectSnooze(id, date, true)) ok++; else break; }
  if (ok) { toast(`ตั้งเตือนอีกครั้งวันที่ ${fmtDate(date)} แล้ว ${ok} งาน`); if (!(window._startPopupIds || []).length) closeAllOverlays(); }
}

  const html = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40">
  <head><meta charset="utf-8"><style>td,th{font-family:Calibri,Arial,sans-serif;}</style></head>
  <body><table>
    <tr>${['พนักงาน','เลขบัตรประชาชน','ตำแหน่ง','ประเภทหลักสูตร','หลักสูตร','วันที่ออก','วันหมดอายุ','สถานะ'].map(th).join('')}</tr>
    ${rows.map(r => `<tr>${td(r.name)}${td(r.idCard)}${td(r.position)}${td(r.type)}${td(r.course)}${td(r.issue)}${td(r.expiry, r.status==='Expired')}${td(r.status, r.status==='Expired')}</tr>`).join('')}
  </table></body></html>`;
  const blob = new Blob(['\ufeff', html], { type: 'application/vnd.ms-excel' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;

  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 2000);

async function updateAllocPositionDisplay(allocId, value, projectId) {
  try {

async function updateAllocDate(allocId, field, value, projectId) {
  const alloc = allocCache.find(a => a.id === allocId);
  const mob = field === 'mob_date' ? value : alloc.mob_date;
  const demob = field === 'demob_date' ? value : alloc.demob_date;
  const conflict = await findOverlappingAllocation(alloc.worker_id, mob, demob, allocId);
  if (conflict) {
    toast(`⚠️ ${alloc.workers?.name||'พนักงานคนนี้'} ติดคิวงาน “${conflict.projects?.project_name||'อื่น'}” ในช่วงเวลาเดียวกัน`, 'err');
    openProjectDetail(projectId);
    return;
  }
  try {
    await supa('/rest/v1/worker_project_allocations?id=eq.' + allocId, { method: 'PATCH', body: JSON.stringify({ [field]: value || null }) });
    toast('อัปเดตวันที่แล้ว');
    openProjectDetail(projectId);
  } catch (e) { toast('อัปเดตไม่สำเร็จ: ' + e.message, 'err'); }
}

/* ---- double-booking guard: interval-overlap test, null end/start = open-ended ---- */
async function findOverlappingAllocation(workerId, mobDate, demobDate, excludeAllocId) {
  const existing = await supa(`/rest/v1/worker_project_allocations?select=*,projects(project_name)&worker_id=eq.${workerId}`);
  const s2 = mobDate ? new Date(mobDate).getTime() : -Infinity;
  const e2 = demobDate ? new Date(demobDate).getTime() : Infinity;
  return existing.find(a => {
    if (a.id === excludeAllocId) return false;
    const s1 = a.mob_date ? new Date(a.mob_date).getTime() : -Infinity;
    const e1 = a.demob_date ? new Date(a.demob_date).getTime() : Infinity;
    return s1 <= e2 && s2 <= e1;
  });
}

function isWorkerEligibleForAssignment(w, requiredClient) {
  if (window._asgBusyTraining && window._asgBusyTraining.has(w.id)) return false;
  const fields = ['passport_exp', 'dlog_exp_date', 'osp_exp_date', 'mcu_exp_date'];
  for (const f of fields) {
    if (w[f]) { const days = daysUntil(w[f]); if (days <= 30) return false; }
  }
  if (requiredClient && w.mcu_client_tags && w.mcu_client_tags.length && !w.mcu_client_tags.includes(requiredClient)) return false;
  return true;
}
/* same checks as above, but returns WHY a worker isn't ready instead of just
   hiding them — the assign-worker list shows everyone who matches the filter
   and flags the reason, rather than removing "not ready" people outright */
function workerReadinessReason(w, requiredClient) {
  if (window._asgBusyTraining && window._asgBusyTraining.has(w.id)) return 'ติดแผนอบรมอยู่ในช่วงนี้';
  const labels = { passport_exp: 'พาสปอร์ต', dlog_exp_date: 'D-log', osp_exp_date: 'OSP', mcu_exp_date: 'MCU' };
  for (const f of Object.keys(labels)) {
    if (w[f]) {
      const days = daysUntil(w[f]);
      if (days < 0) return `${labels[f]}หมดอายุแล้ว`;
      if (days <= 30) return `${labels[f]}ใกล้หมดอายุ (${days} วัน)`;
    }
  }
  if (requiredClient && w.mcu_client_tags && w.mcu_client_tags.length && !w.mcu_client_tags.includes(requiredClient)) return `MCU ไม่ครอบคลุมฝั่ง ${requiredClient}`;
  return null; // ready, no issues
}

function runAssignFilter() {
  const posIds = Array.from(document.querySelectorAll('.asg-pos-chk:checked')).map(el => Number(el.value));
  const courseIds = Array.from(document.querySelectorAll('.asg-course-chk:checked')).map(el => Number(el.value));
  const offshoreVals = Array.from(document.querySelectorAll('.asg-offshore-chk:checked')).map(el => el.value);
  const groupVals = Array.from(document.querySelectorAll('.asg-group-chk:checked')).map(el => el.value);
  const subClient = document.getElementById('asg-sub-client').value;
  const subPosId = document.getElementById('asg-sub-position').value;
  const substituteMode = !!(subClient && subPosId);
  const requiredCourseIds = substituteMode
    ? (window._mandatoryLinksAll||[]).filter(m => m.client_tag === subClient && m.position_id === Number(subPosId)).map(m => m.course_id)
    : [];
  const jobMob = document.getElementById('asg-mob').value || null;
  const jobDemob = document.getElementById('asg-demob').value || null;
  const checkDlog = document.getElementById('asg-check-dlog')?.checked || false;
  const checkOsp = document.getElementById('asg-check-osp')?.checked || false;

  // training-plan conflicts checked against THIS job's actual Mob/De-Mob dates
  // (falls back to a single-day check on Mob date if De-Mob isn't set yet)
  const conflictMap = {}; // worker_id -> the conflicting plan record
  if (jobMob) {
    const rangeEnd = jobDemob || jobMob;
    (window._asgPlanRows || []).forEach(r => {
      if (conflictMap[r.worker_id]) return;
      const planStart = r.plan_date;
      const planEnd = r.plan_end_date || r.plan_date;
      if (planStart <= rangeEnd && planEnd >= jobMob) conflictMap[r.worker_id] = r;
    });
  }

  let list = workersData.filter(w => {
    // these determine whether the worker shows up in the list at all
    if (substituteMode) {
      if (requiredCourseIds.length) {
        const has = window._asgWorkerCourses[w.id] || new Set();
        if (!requiredCourseIds.every(cid => has.has(cid))) return false;
      }
    } else if (posIds.length) {
      const workerPosIds = window._asgWorkerPositions[w.id] || new Set([w.position_id]);
      if (!posIds.some(pid => workerPosIds.has(pid))) return false;
    }
    if (offshoreVals.length) {
      const off = window._asgOffshoreMap[w.id];
      if (!off || !offshoreVals.includes(off.offshore_status)) return false;
    }
    if (groupVals.length && !groupVals.includes(w.group_name)) return false;
    if (courseIds.length) {
      const has = window._asgWorkerCourses[w.id] || new Set();
      if (!courseIds.every(cid => has.has(cid))) return false;
    }
    return true;
  });
  // everyone who matches the filters above is shown — this computes WHY a
  // worker can't actually be picked (shown red + checkbox disabled + tooltip)
  // rather than hiding them outright, so the admin can see who's missing what
  function assignIneligibleReason(w) {
    const reasons = [];
    if (window._asgOverallStatus[w.id] !== 'Complete') reasons.push('Training Matrix ยังไม่ Complete');
    if (conflictMap[w.id]) reasons.push('มีแผนอบรมชนกับช่วง Mob–De-Mob ของงานนี้');
    if (jobMob) {
      const rangeEnd = jobDemob || jobMob;
      if (w.passport_exp && w.passport_exp < rangeEnd) reasons.push('พาสปอร์ตหมดอายุก่อน/ระหว่างช่วงนี้');
      if (w.mcu_exp_date && w.mcu_exp_date < rangeEnd) reasons.push('MCU หมดอายุก่อน/ระหว่างช่วงนี้');
      if (checkDlog && (!w.dlog_exp_date || w.dlog_exp_date < rangeEnd)) reasons.push('D-log ไม่มี/หมดอายุก่อน-ระหว่างช่วงนี้');
      if (checkOsp && (!w.osp_exp_date || w.osp_exp_date < rangeEnd)) reasons.push('OSP ไม่มี/หมดอายุก่อน-ระหว่างช่วงนี้');
    }
    if (substituteMode && subClient && w.mcu_client_tags && w.mcu_client_tags.length && !w.mcu_client_tags.includes(subClient)) {
      reasons.push(`MCU ไม่ครอบคลุมฝั่ง ${subClient}`);
    }
    return reasons;
  }
  list.sort((a, b) => {
    const da = window._asgOffshoreMap[a.id]?.demob_date, db = window._asgOffshoreMap[b.id]?.demob_date;
    if (!da && !db) return 0;
    if (!da) return 1;
    if (!db) return -1;
    return new Date(da) - new Date(db);
  });
  const wrap = document.getElementById('asg-results');
  const subPosTitle = substituteMode ? (CACHE.positions.find(p=>p.id===Number(subPosId))?.title||'') : '';
  wrap.innerHTML = `
    ${substituteMode ? `<div class="cell-sub" style="margin-bottom:6px;color:var(--amber-600);font-weight:700;">🔄 โหมดหาคนทดแทน: แสดงพนักงานทุกตำแหน่งที่มีใบเซอร์ครบตามตำแหน่ง “${esc(subPosTitle)}” (${subClient})</div>` : ''}
    ${!jobMob ? `<div class="cell-sub" style="margin-bottom:6px;color:var(--red-500);">⚠️ ยังไม่ได้ใส่ Mob Date — ระบบจะยังตรวจสอบวันที่ชนกับแผนอบรมไม่ได้จนกว่าจะใส่วันที่</div>` : ''}
    <div class="cell-sub" style="margin:10px 0 6px;">พบ ${list.length} คนตรงตาม filter นี้ — <span style="background:var(--red-100);padding:1px 6px;border-radius:4px;">พื้นหลังสีแดง</span> = เลือกไม่ได้ (วางเมาส์ดูเหตุผล), <span style="background:var(--amber-100);padding:1px 6px;border-radius:4px;">พื้นหลังสีเหลือง</span> = มีแผนงานโปรเจกต์อื่นอยู่แล้ว</div>
    <div style="max-height:260px;overflow-y:auto;border:1px solid var(--line);border-radius:8px;">
      ${list.length ? list.map(w => {
        const off = window._asgOffshoreMap[w.id] || {};
        const hasPlan = isCurrentOrFuturePlan(off);
        const reasons = assignIneligibleReason(w);
        const ineligible = reasons.length > 0;
        return `<label class="chk-row" style="justify-content:space-between;border-radius:0;border-bottom:1px solid var(--fog-100);gap:10px;${ineligible?'background:var(--red-100);':(hasPlan?'background:var(--amber-100);':'')}" ${ineligible?`title="เลือกไม่ได้: ${esc(reasons.join(' | '))}"`:''}>
          <span style="display:flex;align-items:center;gap:8px;">
            <input type="checkbox" class="asg-result-chk" value="${w.id}" data-pos="${w.position_id||''}" ${ineligible?'disabled':''}>
            ${avatarImg(w.photo_url, 26)}
            <b>${esc(w.name)}</b> <span class="cell-sub">— ${esc(w.position_title||'-')}</span>
            ${ineligible?'<span class="badge badge-bad">⚠️ เลือกไม่ได้</span>':''}
          </span>
          <span class="cell-sub" style="white-space:nowrap;text-align:right;">
            ${hasPlan ? `${off.offshore_status?badge(off.offshore_status):''} ${fmtDate(off.mob_date)+' – '+fmtDate(off.demob_date)}<br>` : ''}${restGapCellHtml(window._asgRestGapMap[w.id])}
          </span>
        </label>`;
      }).join('') : `<div class="empty-state"><div class="d">ไม่พบพนักงานตาม filter นี้</div></div>`}
    </div>`;
}
async function saveAssignWorkerBulk(projectId) {
  const checked = Array.from(document.querySelectorAll('.asg-result-chk:checked'));
  if (!checked.length) { toast('กรุณาเลือกพนักงานอย่างน้อย 1 คน', 'err'); return; }
  const mob = document.getElementById('asg-mob').value || null;
  const demob = document.getElementById('asg-demob').value || null;
  const rows = [];
  const skipped = [];
  for (const el of checked) {
    const conflict = await findOverlappingAllocation(el.value, mob, demob, null);
    if (conflict) { skipped.push(conflict.projects?.project_name || 'งานอื่น'); continue; }
    rows.push({ project_id: projectId, worker_id: el.value, assigned_position_id: el.dataset.pos ? Number(el.dataset.pos) : null, mob_date: mob, demob_date: demob });
  }
  if (skipped.length) toast(`⚠️ ข้าม ${skipped.length} คนเพราะติดคิวงานซ้อนกับงานอื่น`, 'err');
  if (!rows.length) return;
  try {
    await supa('/rest/v1/worker_project_allocations', { method: 'POST', headers: { Prefer: 'return=minimal' }, body: JSON.stringify(rows) });
    toast(`เพิ่ม ${rows.length} คนเข้าโปรเจกต์แล้ว`);
    closeAllOverlays();
    openProjectDetail(projectId);
  } catch (e) { toast('บันทึกไม่สำเร็จ: ' + e.message, 'err'); }
}

function filterCVWorkerSelect(q) {
  const sel = document.getElementById('cv-worker-select');
  const query = q.trim().toLowerCase();
  let firstMatch = null;
  Array.from(sel.options).forEach(opt => {
    if (!opt.value) { opt.hidden = false; return; } // keep the placeholder always visible
    const match = !query || (opt.dataset.search || '').includes(query);
    opt.hidden = !match;
    if (match && !firstMatch) firstMatch = opt;
  });
  // if exactly one worker matches, load them straight away for speed
  const visibleWorkerOptions = Array.from(sel.options).filter(o => o.value && !o.hidden);
  if (query && visibleWorkerOptions.length === 1) {
    sel.value = visibleWorkerOptions[0].value;
    loadCVFor(sel.value);
  }
}

function fmtMonthYear(d) { if (!d) return '-'; const dt = new Date(d + 'T00:00:00'); return dt.toLocaleDateString('en-US', { year: 'numeric', month: 'short' }); }
function onCVPositionChange(workerId, isInitialLoad) {
  const sel = document.getElementById('cv-position-select');
  const customInput = document.getElementById('cv-position-custom');
  const isOther = sel.value === 'other';
  customInput.style.display = isOther ? 'block' : 'none';
  const cache = window._cvCache;
  if (isOther) {
    document.querySelectorAll('.cv-train-chk').forEach(chk => { chk.checked = false; });
    return;
  }
  const template = sel.value ? (cache.cvTemplates || []).find(t => String(t.id) === sel.value) : null;
  // auto-fill the top Special Skill summary from this position's template — still
  // editable/appendable afterward. On initial page load, don't clobber content
  // the admin already saved; only overwrite when they deliberately change the dropdown.
  const skillTextarea = document.getElementById('cv-skill');
  if (template && skillTextarea && !(isInitialLoad && skillTextarea.value.trim())) {
    skillTextarea.value = (template.special_skill || []).join('\n');
  }
  // auto-tick Special Training from the mandatory courses of the chosen position
  const mandLinks = cache.mandLinksAll || [];
  const requiredFor = (positionIds, clientTag) => new Set(mandLinks
    .filter(m => positionIds.has(m.position_id) && (!m.client_tag || m.client_tag === clientTag))
    .map(m => m.course_id));
  let requiredCourseIds = new Set();
  if (template) {
    const clientTag = template.client_scope === 'Project' ? 'PTTEP' : template.client_scope;
    // CV template names don't always equal real position names (esp. Project side,
    // e.g. "Pipe Fitter" vs real "Fitter") — match on the title and on the alias
    const wanted = new Set([template.position_title, CV_TEMPLATE_REAL_POSITION_ALIASES[template.position_title]].filter(Boolean));
    requiredCourseIds = requiredFor(new Set(CACHE.positions.filter(p => wanted.has(p.title)).map(p => p.id)), clientTag);
  }
  if (!requiredCourseIds.size) {
    // nothing resolved for the chosen template → use the worker's own position(s)
    // on their own side, so a sensible set is still ticked instead of nothing
    const ownTag = bigGroupToClientTag(bigGroupName(cache.w?.group_name));
    const ownIds = new Set((cache.workerPositions || []).map(p => p.id));
    if (!ownIds.size && cache.w?.position_id) ownIds.add(cache.w.position_id);
    requiredCourseIds = requiredFor(ownIds, ownTag);
  }
  // a Chevron-named cert and its PTTEP-named equivalent count as the same thing
  (cache.courseEquivalences || []).forEach(e => {
    if (requiredCourseIds.has(e.chevron_course_id)) requiredCourseIds.add(e.pttep_course_id);
    if (requiredCourseIds.has(e.pttep_course_id)) requiredCourseIds.add(e.chevron_course_id);
  });
  document.querySelectorAll('.cv-train-chk').forEach(chk => {
    const rec = cache.trainRows.find(t => t.id === chk.value);
    chk.checked = !!(rec && rec.course_id && requiredCourseIds.has(rec.course_id));
  });
}

function exportCVWord(workerId) {
  const cache = window._cvCache;
  if (!cache || cache.workerId !== workerId) { toast('กรุณาโหลดข้อมูล CV ก่อน'); return; }
  // Word's HTML engine does NOT reliably apply CSS classes from a <style>
  // block (that caused sections to render out of order / misaligned) — every
  // style below is inlined directly on each element instead, which Word
  // handles consistently. The footer uses Word's documented mso-element:footer
  // construct (via @page{mso-footer:f1} + a hidden div bound to it) — this is
  // the only way to get a footer that genuinely repeats on every printed page
  // in Word, rather than appearing once at the end of the flowing content.
  const html = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">
  <head><meta charset="utf-8"><title>CV - ${esc(cache.w?.name||'')}</title>
  <!--[if gte mso 9]><xml><w:WordDocument><w:View>Print</w:View><w:DoNotOptimizeForBrowser/><w:DoNotShadeFormData/></w:WordDocument></xml><![endif]-->
  <style>
    @page Section1 { size:8.5in 11.0in; margin:14mm; mso-header-margin:12mm; mso-footer-margin:8mm; mso-footer:f1; mso-title-page:no; }
    div.Section1 { page:Section1; }
    p.MsoFooter, li.MsoFooter, div.MsoFooter { margin:0in; font-size:10.0pt; text-align:left; mso-pagination:widow-orphan; tab-stops:center 3.0in right 6.0in; }
  </style>
  </head><body style="font-family:'Segoe UI',Tahoma,Arial,sans-serif;color:#1a1a1a;line-height:1.5;">
  <div style="mso-element:footer;" id="f1">
    <p class="MsoFooter" style="color:#666;">FO.HRS.14-00 (08-08-2018)</p>
  </div>
  <div class="Section1">${buildCVDocumentHtmlForWord(cache)}</div>
  </body></html>`;
  const blob = new Blob(['\ufeff', html], { type: 'application/msword' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `CV_${(cache.w?.name||'worker').replace(/\s+/g,'_')}.doc`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  toast('ดาวน์โหลดไฟล์ Word แล้ว');
}

async function saveCVExperience(workerId, recordId) {
  const v = id => document.getElementById(id)?.value || null;
  const cleanPosition = v('x2') ? v('x2').replace(/\s*\((Chevron|Project)\)\s*$/, '') : null;
  // year is what matters; month is optional (year-only is stored as Jan 1 of that year, flagged year-only)
  const readYM = (base) => {
    const yRaw = (document.getElementById(base + 'y')?.value || '').trim();
    const m = document.getElementById(base + 'm')?.value || '';
    if (!yRaw) return { ok: !m, date: null, yearOnly: false };
    const y = parseInt(yRaw, 10);
    if (!(y >= 1950 && y <= 2100)) return { ok: false, date: null, yearOnly: false };
    return { ok: true, date: `${y}-${m || '01'}-01`, yearOnly: !m };
  };
  const start = readYM('x3'), end = readYM('x4');
  if (!start.ok || !end.ok) { toast('กรุณาระบุปีให้ถูกต้อง (เช่น 2020) — ถ้าเลือกเดือนต้องใส่ปีด้วย', 'err'); return; }
  const payload = {
    worker_id: workerId,
    company_name: v('x1'), position_title: cleanPosition,
    start_date: start.date, start_year_only: start.yearOnly,
    end_date: end.date, end_year_only: end.yearOnly,
    is_current: !end.date,
    business_type_location: v('x5'),
    responsibilities: (document.getElementById('x6')?.value || '').split('\n').map(s=>s.trim()).filter(Boolean),
    special_skill: (document.getElementById('x7')?.value || '').split('\n').map(s=>s.trim()).filter(Boolean),
  };
  try {
    if (recordId) {
      await supa(`/rest/v1/worker_work_experiences?id=eq.${recordId}`, { method: 'PATCH', body: JSON.stringify(payload) });
    } else {
      await supa('/rest/v1/worker_work_experiences', { method: 'POST', headers: { Prefer: 'return=minimal' }, body: JSON.stringify(payload) });
    }
    toast('บันทึกแล้ว');
    closeAllOverlays();
    loadCVFor(workerId);
  } catch (e) { toast('บันทึกไม่สำเร็จ: ' + e.message, 'err'); }
}

/* ================= สุขภาพ (PE) — health examinations =================
   Only accounts with profiles.can_view_health may open this page; the database (RLS on health_exams,
   health_access_log and the private "health-files" bucket) enforces it, the UI just follows.
   Everyone else only sees the worker's Fit / Unfit + MCU dates (synced by a database trigger). */
function hasHealthAccess() { return !!profile?.can_view_health && !isClient(); }
const HEALTH_FIT = ['Fit Offshore', 'Fit Offshore 6m', 'Unfit Offshore', 'Fit Onshore'];
const HEALTH_FIT_LABEL = { 'Fit Offshore': 'Fit to work Offshore', 'Fit Offshore 6m': 'Fit to work Offshore 6m.', 'Unfit Offshore': 'Unfit to work Offshore', 'Fit Onshore': 'Fit to work Onshore' };
/* exam date + n months (clamped to the month's last day), as yyyy-mm-dd */
function addMonthsIso(iso, n) {
  const [y, m, d] = iso.split('-').map(Number); const t = new Date(Date.UTC(y, m - 1 + n, 1));
  const last = new Date(Date.UTC(t.getUTCFullYear(), t.getUTCMonth() + 1, 0)).getUTCDate();
  return `${t.getUTCFullYear()}-${String(t.getUTCMonth() + 1).padStart(2, '0')}-${String(Math.min(d, last)).padStart(2, '0')}`;
}
const fitMonths = f => f === 'Fit Offshore 6m' ? 6 : 12;
const HEALTH_DENTAL = { good: 'สุขภาพฟันดี', follow: 'ติดตามสุขภาพฟัน' };
/* certificates kept on the worker, entered in สุขภาพ (PE), shown (read-only) in Add Worker. Files: private bucket "worker-docs" */
const HEALTH_DOCS = [['dlog', 'D-log'], ['bosiet', 'BOSIET (D-log)'], ['osp', 'OSP'], ['osp_bosiet', 'BOSIET (OSP)'], ['mcu', 'MCU'], ['ffd', 'FFD']];
const DOC_TREES = [['dlog', 'bosiet'], ['osp', 'osp_bosiet']]; // parent → its own BOSIET
/* soft colour per document: [background, border, title colour] */
const DOC_COLORS = {
  mcu: ['#EEF9F2', '#8FD0A8', '#1E7B52'], ffd: ['#F5F1FD', '#B9A6E6', '#5B3B9A'],
  dlog: ['#EEF5FD', '#8DB4E2', '#1F4E79'], bosiet: ['#F5F9FE', '#B7CFEC', '#2D5583'],
  osp: ['#EAF8F6', '#7FCBC1', '#137266'], osp_bosiet: ['#F3FBFA', '#B3E0DA', '#1D7F73'],
};
const docStyle = k => { const c = DOC_COLORS[k] || ['#fff', '#E4EAF4', 'inherit']; return `background:${c[0]};border-color:${c[1]}55;border-left-color:${c[1]};`; };
const docTitleColor = k => (DOC_COLORS[k] || [])[2] || 'inherit';
const isBosiet = k => k === 'bosiet' || k === 'osp_bosiet';
const docParentOf = k => (DOC_TREES.find(t => t[1] === k) || [])[0];
const docShortLabel = k => isBosiet(k) ? 'BOSIET' : (HEALTH_DOCS.find(d => d[0] === k) || [, k])[1];
function workerDocStatus(w, k) {
  const exp = w?.[k + '_exp_date'];
  if (!exp) return { cls: 'none', text: 'ยังไม่มีข้อมูล' };
  const days = daysBetweenIso(localToday(), exp);
  if (days < 0) return { cls: 'overdue', days, text: `หมดอายุแล้ว ${-days} วัน` };
  if (days <= 30) return { cls: 'soon', days, text: `หมดอายุอีก ${days} วัน` };
  return { cls: 'ok', days, text: `ใช้ได้ถึง ${fmtDate(exp)}` };
}
async function uploadWorkerDoc(file, wid, k) {
  const ext = ((file.name || 'file').split('.').pop() || 'bin').toLowerCase().replace(/[^a-z0-9]/g, '');
  const path = `${wid}/${k}/${Date.now()}_${Math.random().toString(36).slice(2, 8)}.${ext}`;
  const r = await fetch(`${SUPA_URL}/storage/v1/object/worker-docs/${path}`, { method: 'POST', headers: { apikey: SUPA_ANON, Authorization: 'Bearer ' + session.access_token, 'Content-Type': file.type || 'application/octet-stream' }, body: file });
  if (!r.ok) throw new Error(await r.text());
  return path;
}
async function openWorkerDoc(path) {

    const d = await r.json(); if (!r.ok) throw new Error(d.message || d.error || r.statusText);

/* read-only block for the Add Worker form: dates + status + files, all coming from สุขภาพ (PE) */
function workerHealthDocsReadonlyHtml(w) {

  const row = ([k, l]) => {

function healthRiskLevel(ex) {
  if (!ex) return { level: 0, items: [] };
  const items = [];
  HEALTH_RISK.forEach(r => {
    const v = Number(ex[r.k]); if (ex[r.k] == null || !isFinite(v)) return;
    if (v >= r.red) items.push({ ...r, v, lv: 2 }); else if (v >= r.amber) items.push({ ...r, v, lv: 1 });
  });
  return { level: items.reduce((m, x) => Math.max(m, x.lv), 0), items };
}
function healthDueInfo(ex) {
  if (!ex || !ex.due_date) return { cls: 'none', days: null, text: ex ? 'ไม่ระบุวันครบกำหนด' : 'ยังไม่มีผลตรวจ' };
  const days = daysBetweenIso(localToday(), ex.due_date);
  if (days < 0) return { cls: 'overdue', days, text: `เกินกำหนด ${-days} วัน` };
  if (days <= 30) return { cls: 'soon', days, text: `อีก ${days} วัน` };
  if (days <= 90) return { cls: 'mid', days, text: `อีก ${days} วัน` };
  return { cls: 'ok', days, text: `อีก ${days} วัน` };
}

/* donut chart: segments = [[filterKey, label, color]] */
function healthDonutHtml(title, segs, ws, opts = {}) {
  const data = segs.map(([key, label, color]) => ({ key, label, color, n: ws.filter(HEALTH_FILTERS[key][1]).length }));
  const total = data.reduce((a, d) => a + d.n, 0);
  const size = opts.small ? 118 : 150, r = opts.small ? 44 : 56, sw = opts.small ? 15 : 19, c = 2 * Math.PI * r;
  let off = 0;
  const arcs = total ? data.filter(d => d.n).map(d => {
    const len = d.n / total * c;
    const arc = `<circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${d.color}" stroke-width="${sw}" stroke-dasharray="${len} ${c - len}" stroke-dashoffset="${-off}" transform="rotate(-90 ${size / 2} ${size / 2})" style="cursor:pointer;transition:stroke-width .15s;" onmouseover="this.setAttribute('stroke-width','${sw + 4}')" onmouseout="this.setAttribute('stroke-width','${sw}')" onclick="goHealthList('${d.key}')"><title>${esc(d.label)}: ${d.n} คน (${Math.round(d.n / total * 100)}%)</title></circle>`;
    off += len; return arc;
  }).join('') : '';
  // centre number = the "ready / OK" part (one key, or several keys added together)
  const ck = opts.centerKeys || (opts.centerKey ? [opts.centerKey] : null);
  const hiParts = ck ? data.filter(d => ck.includes(d.key)) : [];
  const hi = hiParts.length ? { n: hiParts.reduce((a, d) => a + d.n, 0), color: opts.centerColor || hiParts[0].color, label: hiParts[0].label } : null;
  const tint = opts.tint || ['#F3F7FC', '#2D5583'];
  return `<div class="panel" style="padding:14px 16px;margin:0;display:flex;flex-direction:column;background:linear-gradient(180deg,${tint[0]} 0,#fff 62px);${opts.border ? `border-top:3px solid ${opts.border};` : ''}">
    <div class="form-section-title" style="margin-bottom:8px;text-transform:none;color:${tint[1]};">${title}</div>
    <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;">
      <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="flex:none;">
        <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="var(--fog-50,#F1F4F8)" stroke-width="${sw}"/>${arcs}
        <text x="50%" y="${size / 2 - (opts.small ? 2 : 4)}" text-anchor="middle" style="font-size:${opts.small ? 20 : 26}px;font-weight:800;fill:${hi ? hi.color : 'var(--navy-900)'};">${hi ? hi.n : total}</text>
        <text x="50%" y="${size / 2 + (opts.small ? 15 : 18)}" text-anchor="middle" style="font-size:${opts.small ? 9.5 : 11}px;fill:var(--grey-500);">${esc(hi ? opts.centerLabel || hi.label : 'คน')}</text>
      </svg>
      <div style="flex:1;min-width:130px;">
        ${data.map(d => `<div onclick="goHealthList('${d.key}')" style="display:flex;align-items:center;gap:7px;padding:3px 6px;margin:1px 0;border-radius:6px;cursor:pointer;font-size:12.5px;" onmouseover="this.style.background='var(--fog-50,#F1F4F8)'" onmouseout="this.style.background=''">
          <span style="width:10px;height:10px;border-radius:3px;background:${d.color};flex:none;"></span>
          <span style="flex:1;">${esc(d.label)}</span><b style="color:${d.n ? 'var(--navy-900)' : 'var(--grey-500)'};">${d.n}</b>
          <span class="cell-sub" style="width:34px;text-align:right;">${total ? Math.round(d.n / total * 100) + '%' : ''}</span></div>`).join('')}
      </div>
    </div></div>`;
}

function paintHealthFilter(q) {

    const ex = latestExam(w.id);
    const hay = [w.name, w.id_card, w.id_passport, w.company, w.group_name, w.position_title, w.borrowed_from, w.is_borrowed ? 'พนักงานยืม' : '', ex?.provider, ex?.doctor, HEALTH_FIT_LABEL[ex?.fit_status] || '', ex?.underlying_disease, HEALTH_DENTAL[ex?.dental_status] || ''];
    return chipsMatch('health', hay) && matchesQuery(hay, q);

    const clients = HEALTH_DOCS.map(([k, l]) => { const st = workerDocStatus(w, k); if (st.cls === 'none') return '';

      return healthStatusBadge(st, st.cls === 'ok' ? `${sl} ✓` : st.cls === 'soon' ? `${sl} ${st.days} วัน` : `${sl} หมดอายุ`).replace('<span class="badge', `<span title="${esc(l)}: ${esc(st.text)}" class="badge`); }).join(' ') || '<span class="cell-sub">-</span>';
    const dent = ex?.dental_status ? `<span class="badge" style="${ex.dental_status === 'follow' ? 'background:#FFF1D6;color:#9C5700;' : 'background:#E3F4EC;color:#1E7B52;'}">${esc(HEALTH_DENTAL[ex.dental_status])}</span>` : '<span class="cell-sub">-</span>';

/* pop-up on opening a worker: documents expired / expiring within 30 days (BOSIET: must be added into the system 30 days ahead) */

  const exam = healthDueInfo(latestExam(w.id));
  if (['soon', 'overdue'].includes(exam.cls)) due.unshift(['exam', 'ตรวจสุขภาพประจำปี', { cls: exam.cls, text: exam.cls === 'overdue' ? exam.text : `ครบกำหนดตรวจ${exam.text}` }]);

const normHeader = v => String(v ?? '').toLowerCase().replace(/[\s\r\n().:]+/g, '');
const digitsOnly = v => String(v ?? '').replace(/\D/g, '');
function excelCellValue(v) {
  if (v && typeof v === 'object') { if (v instanceof Date) return v; if ('result' in v) return v.result; if ('text' in v) return v.text; if (v.richText) return v.richText.map(x => x.text).join(''); }

function healthImportDate(v) {
  v = excelCellValue(v);
  if (v instanceof Date) { let y = v.getUTCFullYear(); if (y > 2400) y -= 543; if (y < 1900 || y > 2200) return null; return `${y}-${String(v.getUTCMonth() + 1).padStart(2, '0')}-${String(v.getUTCDate()).padStart(2, '0')}`; }
  const s = String(v ?? '').trim(); const m = s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/);
  if (m) { let y = Number(m[3]); if (y > 2400) y -= 543; return `${y}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`; }
  return /^\d{4}-\d{2}-\d{2}/.test(s) ? s.slice(0, 10) : null;
}

      for (let r = two ? 3 : 2; r <= ws.rowCount; r++) {
        const row = ws.getRow(r); const g = f => cols[f] ? excelCellValue(row.getCell(cols[f]).value) : null;
        const name = [g('_name'), g('_surname')].filter(Boolean).map(x => String(x).trim()).join(' ');
        const idRaw = g('_id'); if (!name && !idRaw) continue;
        const w = idMap[digitsOnly(idRaw)] || idMap['P:' + String(idRaw || '').trim().toUpperCase()];
        const rec = {};
        HEALTH_IMPORT_MAP.forEach(([f]) => {
          if (f.startsWith('_') || !cols[f]) return; const v = g(f);
          if (HEALTH_DATE.has(f)) rec[f] = healthImportDate(v);
          else if (HEALTH_NUM.has(f)) { const n = Number(String(v ?? '').replace(/,/g, '').trim()); rec[f] = v == null || String(v).trim() === '' || !isFinite(n) ? null : n; }
          else { const s = v == null ? '' : (v instanceof Date ? healthImportDate(v) : String(v).trim()); rec[f] = s || null; }
        });
        const fitTxt = String(g('_fitcombo') || '').toLowerCase();
        if (String(g('_unfit') || '').trim() || fitTxt.includes('unfit')) rec.fit_status = 'Unfit Offshore';
        else if (fitTxt.includes('onshore')) rec.fit_status = 'Fit Onshore';
        else if (/6\s*m/.test(fitTxt)) rec.fit_status = 'Fit Offshore 6m';
        else if (String(g('_fit') || '').trim() || fitTxt.includes('fit')) rec.fit_status = 'Fit Offshore';
        const info = { row: r, name, id: String(idRaw || ''), company: g('_company') || '', location: g('_location') || '', position: g('_position') || '', dob: healthImportDate(g('_dob')) };
        if (!rec.exam_date) { skipped.push({ ...info, why: 'ไม่มีวันที่ตรวจ' }); continue; }
        if (!w) { unmatched.push({ ...info, rec }); continue; }
        if (existing.has(w.id + '|' + rec.exam_date)) { skipped.push({ ...info, why: 'มีผลตรวจวันนี้อยู่แล้ว' }); continue; }
        existing.add(w.id + '|' + rec.exam_date);
        recs.push({ ...rec, worker_id: w.id, _w: w, _info: info });
      }
      sheets.push({ name: ws.name, recs, unmatched, skipped, ncols: Object.keys(cols).length });
    });
    window._healthImport = sheets;
    if (!sheets.length) { out.innerHTML = '<div class="empty-state"><div class="d">ไม่พบชีตที่มีหัวตาราง Name / Person ID</div></div>'; return; }
    out.innerHTML = sheets.map((s, i) => `
      <div style="border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;">
        <label class="chk-row" style="font-weight:700;"><input type="checkbox" class="hi-sheet" value="${i}" ${s.recs.length ? 'checked' : ''}> ชีต “${esc(s.name)}”</label>
        <div class="cell-sub" style="margin:4px 0 8px;">พบคอลัมน์ที่ใช้ได้ ${s.ncols} คอลัมน์ ·
          <b style="color:#1E7B52;">นำเข้าได้ ${s.recs.length}</b> · <b style="color:#C27A00;">ไม่พบพนักงานในระบบ ${s.unmatched.length}</b> · ข้าม ${s.skipped.length}</div>
        ${s.unmatched.length ? `<details><summary class="cell-sub" style="cursor:pointer;">ดูรายชื่อที่ไม่พบในระบบ (${s.unmatched.length})</summary>
          <div class="table-wrap" style="max-height:260px;margin-top:6px;"><table><thead><tr><th>แถว</th><th>ชื่อ</th><th>เลขบัตร</th><th>บริษัท / สถานที่</th><th>ตำแหน่ง</th></tr></thead>
          <tbody>${s.unmatched.map(u => `<tr><td>${u.row}</td><td>${esc(u.name)}</td><td>${esc(u.id)}</td><td>${esc(u.company)} ${esc(u.location)}</td><td>${esc(u.position)}</td></tr>`).join('')}</tbody></table></div>
          ${isAdmin() ? `<label class="chk-row" style="margin-top:6px;"><input type="checkbox" class="hi-create" value="${i}"> เพิ่มคนที่ไม่พบเป็น <b>พนักงานยืม</b> ใน Add Worker แล้วนำเข้าผลตรวจด้วย (ใช้ “บริษัท / สถานที่” ในไฟล์เป็นบริษัทต้นสังกัด)</label>`
            : '<div class="cell-sub" style="margin-top:6px;">ให้ Admin เพิ่มรายชื่อเหล่านี้ใน Add Worker (เป็นพนักงานยืม) ก่อน แล้วนำเข้าไฟล์อีกครั้ง</div>'}
        </details>` : ''}
        ${s.skipped.length ? `<details><summary class="cell-sub" style="cursor:pointer;">ดูรายการที่ข้าม (${s.skipped.length})</summary><div class="cell-sub" style="max-height:160px;overflow:auto;">${s.skipped.slice(0, 300).map(x => `แถว ${x.row} ${esc(x.name)} — ${x.why}`).join('<br>')}</div></details>` : ''}
      </div>`).join('') + `<button class="btn btn-primary" style="width:auto;" onclick="saveHealthImport()">💾 บันทึกรายการที่เลือก</button>`;
  } catch (e) { out.innerHTML = `<div class="empty-state"><div class="t">อ่านไฟล์ไม่สำเร็จ</div><div class="d">${esc(e.message)}</div></div>`; }
}
async function saveHealthImport() {
  const sheets = window._healthImport || [];
  const pick = new Set([...document.querySelectorAll('.hi-sheet:checked')].map(x => Number(x.value)));
  const create = new Set([...document.querySelectorAll('.hi-create:checked')].map(x => Number(x.value)));
  const out = document.getElementById('health-import-result');
  let recs = [];
  try {
    for (const i of pick) recs.push(...sheets[i].recs);
    for (const i of create) {
      if (!pick.has(i)) continue;
      const seen = {};
      for (const u of sheets[i].unmatched) {
        const key = digitsOnly(u.id) || u.name;
        if (!seen[key]) {
          const created = await supa('/rest/v1/workers', { method: 'POST', headers: { Prefer: 'return=representation' }, body: JSON.stringify({
            name: u.name, id_card: u.id || null, date_of_birth: u.dob, company: 'Sub', group_name: String(u.location || '').trim() || null,
            is_borrowed: true, borrowed_from: String(u.company || u.location || '').trim() || null, employment_status: 'Active' }) });
          seen[key] = created[0].id;
        }
        recs.push({ ...u.rec, worker_id: seen[key] });
      }
    }
    if (!recs.length) { toast('ไม่มีรายการให้บันทึก', 'err'); return; }
    const keys = ['worker_id', ...HEALTH_SECTIONS.flatMap(s => s[1].map(f => f[0]))]; // PostgREST bulk insert needs the same keys on every row
    const rows = recs.map(r => { const x = {}; keys.forEach(k => { x[k] = r[k] ?? null; }); return x; });
    for (let k = 0; k < rows.length; k += 200) {
      out.insertAdjacentHTML('afterbegin', `<div class="cell-sub">กำลังบันทึก ${Math.min(k + 200, rows.length)} / ${rows.length}...</div>`);
      await supa('/rest/v1/health_exams', { method: 'POST', headers: { Prefer: 'return=minimal' }, body: JSON.stringify(rows.slice(k, k + 200)) });
    }
    logHealthAccess(null, 'import');
    toast(`นำเข้าผลตรวจแล้ว ${rows.length} รายการ`);
    window._healthTab = 'dashboard'; renderHealth();
  } catch (e) { toast('นำเข้าไม่สำเร็จ: ' + e.message, 'err'); }
}

function showModal(title, bodyHtml, size) {
  let modal = document.getElementById('generic-modal');
  if (modal) modal.remove();
  modal = document.createElement('div');
  modal.className = 'modal' + (size === 'lg' ? ' modal-lg' : ''); modal.id = 'generic-modal';
  modal.innerHTML = `<div class="modal-head" style="display:flex;justify-content:space-between;align-items:center;"><h3>${title}</h3><button class="icon-btn" onclick="closeAllOverlays()">✕</button></div><div class="modal-body">${bodyHtml}</div>`;
  document.body.appendChild(modal);
  openOverlay();
  requestAnimationFrame(() => modal.classList.add('open'));
}
function showStackedModal(title, bodyHtml, size) {
  let modal = document.getElementById('stacked-modal');
  if (modal) modal.remove();
  modal = document.createElement('div');
  modal.className = 'modal stacked' + (size === 'lg' ? ' modal-lg' : ''); modal.id = 'stacked-modal';
  modal.innerHTML = `<div class="modal-head" style="display:flex;justify-content:space-between;align-items:center;"><h3>${title}</h3><button class="icon-btn" onclick="closeStackedModal()">✕</button></div><div class="modal-body">${bodyHtml}</div>`;
  document.body.appendChild(modal);
  document.getElementById('stacked-overlay').classList.add('open');
  requestAnimationFrame(() => modal.classList.add('open'));
}
function closeStackedModal() {
  const modal = document.getElementById('stacked-modal');
  if (modal) { modal.classList.remove('open'); setTimeout(() => { if (modal.parentNode) modal.remove(); }, 250); }
  document.getElementById('stacked-overlay').classList.remove('open');
}
