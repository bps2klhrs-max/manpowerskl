<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Best Performance Engineering — Offshore Manpower Status Dashboard</title>
<style>
:root{
  --navy-950:#081826;
  --navy-900:#0B2942;
  --navy-800:#123655;
  --navy-700:#1B4A73;
  --steel-600:#235789;
  --steel-400:#4C86B8;
  --amber-500:#F2A93B;
  --amber-600:#D98E1F;
  --red-500:#D64545;
  --red-100:#FBE7E7;
  --green-600:#2E9E6D;
  --green-100:#E4F5EE;
  --amber-100:#FDEFD8;
  --fog-50:#F3F5F7;
  --fog-100:#E9EDF1;
  --grey-500:#64748B;
  --grey-700:#3C4A5C;
  --line:#DEE4EA;
  --radius:10px;
  --shadow:0 1px 2px rgba(11,41,66,.06), 0 8px 24px -12px rgba(11,41,66,.18);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Leelawadee UI","Sarabun","Noto Sans Thai",Tahoma,sans-serif;
  background:var(--fog-50);
  color:var(--grey-700);
  font-size:14px;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--amber-100);}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;font-size:14px;}

/* ---------- hazard tape signature rule ---------- */
.hazard-rule{
  height:7px;width:100%;
  background:repeating-linear-gradient(135deg, var(--amber-500) 0 14px, var(--navy-900) 14px 28px);
  opacity:.9;
}

/* ---------- login ---------- */
#login-screen{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:
    radial-gradient(circle at 15% 20%, rgba(76,134,184,.25), transparent 40%),
    linear-gradient(180deg, var(--navy-950), var(--navy-900) 60%, var(--navy-800));
  padding:24px;
}
.login-card{
  width:100%;max-width:380px;background:#fff;border-radius:16px;
  box-shadow:0 30px 60px -20px rgba(0,0,0,.5);overflow:hidden;
}
.login-brand{
  background:var(--navy-900);padding:28px 28px 20px;text-align:center;
}
.login-brand .logos{display:flex;justify-content:center;gap:14px;margin-bottom:14px;}
.login-brand .logos img{height:56px;width:56px;border-radius:10px;background:#fff;padding:4px;object-fit:contain;}
.login-brand h1{color:#fff;font-size:15px;font-weight:700;letter-spacing:.3px;margin:0;line-height:1.4;}
.login-brand p{color:var(--steel-400);font-size:11.5px;letter-spacing:1.5px;text-transform:uppercase;margin:6px 0 0;font-weight:600;}
.login-body{padding:26px 28px 30px;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--grey-700);margin-bottom:6px;}
.field input,.field select,.field textarea{
  width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fbfcfd;
  transition:border-color .15s, box-shadow .15s;
}
.field input:focus,.field select:focus,.field textarea:focus{
  outline:none;border-color:var(--steel-600);box-shadow:0 0 0 3px rgba(35,87,137,.12);background:#fff;
}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:10px 16px;border-radius:8px;border:none;font-weight:600;font-size:13.5px;
  transition:filter .15s, transform .05s;
}
.btn:active{transform:translateY(1px);}
.btn-primary{background:var(--navy-900);color:#fff;width:100%;}
.btn-primary:hover{filter:brightness(1.15);}
.btn-amber{background:var(--amber-500);color:var(--navy-950);}
.btn-amber:hover{filter:brightness(1.06);}
.btn-outline{background:#fff;border:1px solid var(--line);color:var(--grey-700);}
.btn-outline:hover{border-color:var(--steel-600);color:var(--steel-600);}
.btn-ghost{background:transparent;color:var(--grey-500);}
.btn-ghost:hover{color:var(--navy-900);}
.btn-danger{background:var(--red-100);color:var(--red-500);}
.btn-danger:hover{filter:brightness(0.97);}
.btn-sm{padding:6px 11px;font-size:12.5px;border-radius:7px;}
.error-msg{background:var(--red-100);color:#a12020;padding:10px 12px;border-radius:8px;font-size:12.5px;margin-bottom:14px;display:none;}
.hint{font-size:11.5px;color:var(--grey-500);margin-top:16px;text-align:center;}

/* ---------- app shell ---------- */
#app-shell{display:none;min-height:100vh;}
.sidebar{
  position:fixed;top:0;left:0;bottom:0;width:248px;background:var(--navy-900);
  display:flex;flex-direction:column;color:#fff;z-index:20;
}
.sidebar-brand{padding:22px 20px 16px;border-bottom:1px solid rgba(255,255,255,.08);}
.sidebar-brand .logos{display:flex;gap:8px;margin-bottom:12px;}
.sidebar-brand .logos img{height:36px;width:36px;border-radius:7px;background:#fff;padding:2px;object-fit:contain;}
.sidebar-brand h1{font-size:12.5px;font-weight:700;line-height:1.45;margin:0;color:#fff;}
.sidebar-brand p{font-size:9.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--steel-400);margin:5px 0 0;font-weight:700;}
.nav{flex:1;padding:14px 10px;overflow-y:auto;}
.nav-item{
  display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:8px;
  color:rgba(255,255,255,.68);font-size:13px;font-weight:600;margin-bottom:2px;cursor:pointer;
  transition:background .15s,color .15s;
}
.nav-item svg{width:17px;height:17px;flex-shrink:0;opacity:.85;}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff;}
.nav-item.active{background:var(--steel-600);color:#fff;}
.nav-item.active svg{opacity:1;}
.sidebar-foot{padding:14px 18px;border-top:1px solid rgba(255,255,255,.08);}
.sidebar-user{font-size:12px;color:rgba(255,255,255,.55);margin-bottom:8px;word-break:break-all;}
.sidebar-role{display:inline-block;background:rgba(242,169,59,.18);color:var(--amber-500);font-size:10px;font-weight:700;letter-spacing:.5px;padding:2px 7px;border-radius:5px;margin-top:4px;text-transform:uppercase;}

.main{margin-left:248px;min-height:100vh;display:flex;flex-direction:column;}
.topbar{
  background:#fff;padding:18px 28px 16px;display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--line);
}
.topbar h2{margin:0;font-size:19px;color:var(--navy-900);font-weight:700;}
.topbar .sub{font-size:12.5px;color:var(--grey-500);margin-top:3px;}
.content{padding:26px 28px 60px;flex:1;}

/* ---------- kpi tiles ---------- */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:22px;}
.kpi-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);}
.kpi-card .num{font-size:26px;font-weight:800;color:var(--navy-900);font-variant-numeric:tabular-nums;}
.kpi-card .label{font-size:11.5px;color:var(--grey-500);font-weight:600;margin-top:2px;text-transform:uppercase;letter-spacing:.4px;}
.kpi-card.accent-red .num{color:var(--red-500);}
.kpi-card.accent-amber .num{color:var(--amber-600);}
.kpi-card.accent-green .num{color:var(--green-600);}

.panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:20px;}
.panel-head{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}
.panel-head h3{margin:0;font-size:14.5px;color:var(--navy-900);font-weight:700;}
.panel-body{padding:18px 20px;}
.two-col{display:grid;grid-template-columns:1.3fr 1fr;gap:18px;}
@media(max-width:980px){.two-col{grid-template-columns:1fr;}}

.status-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13px;}
.status-row:last-child{border-bottom:none;}
.status-row .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.status-row .name{flex:1;color:var(--grey-700);font-weight:600;}
.status-row .count{font-weight:800;color:var(--navy-900);font-variant-numeric:tabular-nums;}
.bar-track{flex:1;height:7px;background:var(--fog-100);border-radius:99px;overflow:hidden;margin:0 10px;}
.bar-fill{height:100%;border-radius:99px;}

/* ---------- table ---------- */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px;}
.search-input{position:relative;flex:1;min-width:200px;max-width:320px;}
.health-page{background:linear-gradient(180deg,#F4F8FF 0,#FAF7FF 45%,#F5FBF8 100%);border:1px solid #E8EEF7;border-radius:18px;padding:14px 16px 18px;}
.health-page .tabs{background:#fff;border-radius:12px;padding:4px;border:1px solid #E6ECF5;display:inline-flex;gap:2px;margin-bottom:10px;}
.health-page .tab-btn{border-radius:9px;}
.health-page .tab-btn.active{background:#EAF2FD;color:#1F4E79;}
.health-page .panel{border:1px solid #E4EAF4;box-shadow:0 2px 12px rgba(31,78,121,.06);border-radius:14px;}
.health-page .table-wrap{border-radius:14px;border:1px solid #E4EAF4;box-shadow:0 2px 12px rgba(31,78,121,.05);}
.health-page thead th{background:#F1F6FC !important;color:#2D5583;}
.health-page .kpi-card{border-color:#E4EAF4;}
.hp-sec{border-radius:12px;padding:12px 14px;border:1px solid #E4EAF4;}
.doc-row{border-radius:10px;border:1px solid transparent;border-left-width:4px;margin:6px 0;padding:8px 10px !important;}
.health-row{cursor:pointer;}
/* BOSIET drawn as a sub-item of D-log and OSP: a bracket from both rows into the BOSIET row */
.doc-tree{position:relative;margin-bottom:6px;}
.doc-tree .doc-parent{position:relative;}
.doc-tree .doc-parent::before{content:"";position:absolute;left:3px;top:100%;height:8px;border-left:2px solid #6F93BD;}
.doc-tree .doc-child{position:relative;margin-left:22px;padding-left:16px !important;}
.doc-tree .doc-child::before{content:"";position:absolute;left:-18px;top:-8px;height:40px;width:16px;border-left:2px solid #6F93BD;border-bottom:2px solid #6F93BD;border-bottom-left-radius:8px;}
.doc-tree .doc-child-tag{font-size:10.5px;font-weight:700;color:#3E6A9A;background:#E3EEFA;border-radius:4px;padding:1px 6px;margin-left:4px;}
.doc-popup-ov{position:fixed;inset:0;background:rgba(8,24,38,.35);z-index:60;display:flex;align-items:center;justify-content:center;}
.doc-popup{background:#fff;border-radius:14px;box-shadow:0 30px 70px rgba(0,0,0,.35);width:min(440px,92vw);padding:20px 22px;animation:docpop .18s ease-out;}
@keyframes docpop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
.health-row:hover td{background:#F5F8FC;}
.health-row td{vertical-align:top;}
.chip-search{position:relative;flex:1;min-width:260px;max-width:620px;display:flex;flex-wrap:wrap;align-items:center;gap:5px;padding:5px 10px 5px 34px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:text;min-height:38px;}
.chip-search:focus-within{border-color:var(--navy-700,#1F4E79);box-shadow:0 0 0 2px rgba(31,78,121,.12);}
.chip-search svg{position:absolute;left:11px;top:11px;width:15px;height:15px;color:var(--grey-500);}
.chip-search input{flex:1;min-width:150px;border:0;outline:0;padding:4px 2px;background:transparent;font-size:13px;}
.search-chip{display:inline-flex;align-items:center;gap:4px;background:#E8EEF5;color:var(--navy-900);border:1px solid #C9D6E5;border-radius:5px;padding:2px 4px 2px 8px;font-size:12px;font-weight:600;max-width:260px;}
.search-chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.search-chip button{border:0;background:transparent;color:var(--grey-500);cursor:pointer;font-size:14px;line-height:1;padding:0 3px;border-radius:3px;}
.search-chip button:hover{background:#C9D6E5;color:var(--navy-900);}
.search-input input{width:100%;padding:9px 12px 9px 34px;border:1px solid var(--line);border-radius:8px;background:#fff;}
.search-input svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--grey-500);}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:#fff;box-shadow:var(--shadow);}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:640px;}
thead th{
  background:var(--fog-50);color:var(--grey-500);font-size:10.5px;font-weight:700;text-transform:uppercase;
  letter-spacing:.4px;text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap;
}
tbody td{padding:11px 14px;border-bottom:1px solid var(--fog-100);vertical-align:middle;white-space:nowrap;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:var(--fog-50);}
.cell-name{font-weight:700;color:var(--navy-900);}
.cell-sub{font-size:11.5px;color:var(--grey-500);}

.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:700;white-space:nowrap;}
.badge::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;}
.badge-ok{background:var(--green-100);color:var(--green-600);}
.badge-warn{background:var(--amber-100);color:var(--amber-600);}
.badge-bad{background:var(--red-100);color:var(--red-500);}
.badge-neutral{background:var(--fog-100);color:var(--grey-500);}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;flex-wrap:wrap;}
.tab-btn{padding:10px 16px;background:none;border:none;border-bottom:2px solid transparent;font-weight:700;font-size:13px;color:var(--grey-500);}
.tab-btn.active{color:var(--navy-900);border-bottom-color:var(--amber-500);}
.tab-btn:hover{color:var(--navy-900);}
/* Training Matrix: keep the whole header stack pinned while the page scrolls —
   page header (title + refresh) → tab bar → the tab's search / filter bar.
   Offsets come from updateTrainingStickyOffsets() because heights vary (tabs can wrap). */
.tabs.tabs-sticky{position:sticky;top:var(--tm-top1,0px);z-index:16;background:var(--fog-50);}
/* expiry summary bar above the worker table */
.doc-alert-bar{background:#fff;border:1px solid var(--line);border-left:4px solid var(--amber-600);border-radius:var(--radius);padding:10px 14px;margin-bottom:10px;box-shadow:var(--shadow);}
.doc-alert-title{font-weight:800;color:var(--navy-900);margin-bottom:8px;}
.doc-alert-groups{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;}
.doc-alert-group{display:flex;align-items:center;gap:6px;}
.doc-alert-label{font-weight:700;font-size:12.5px;min-width:58px;}
.doc-alert-chip{border:1px solid transparent;border-radius:999px;padding:3px 11px;font-size:12px;cursor:pointer;font-family:inherit;}
.doc-alert-chip:disabled{cursor:default;opacity:.6;}
.doc-alert-chip:not(:disabled):hover{filter:brightness(.96);border-color:currentColor;}
.doc-alert-chip.active{outline:2px solid var(--navy-900);outline-offset:1px;}
.doc-alert-chip.all{background:var(--navy-900);color:#fff;}
.doc-alert-chip.clear{background:var(--fog-50);color:var(--grey-700);border-color:var(--line);}
.proj-start-card{border:1px solid var(--line);border-left:4px solid var(--amber-600);border-radius:10px;padding:12px 14px;margin-bottom:10px;background:#fff;}
/* Remind table: scrolls inside its own box (vertical + horizontal), header row stays visible */
.remind-wrap{max-height:calc(100vh - var(--tm-top2,124px) - 150px);overflow:auto;}
.remind-wrap thead th{position:sticky;top:0;z-index:3;}
.remind-wrap thead th,.remind-wrap tbody td{padding-left:9px;padding-right:9px;}
.remind-wrap table{font-size:12.5px;}
@media (min-width:900px){
  body[data-view="training"] .topbar{position:sticky;top:0;z-index:17;}
  #training-tab-body > .toolbar:first-child, #training-tab-body > .search-input:first-child{
    position:sticky;top:var(--tm-top2,0px);z-index:15;background:var(--fog-50);padding:8px 0;}
}

.empty-state{padding:50px 20px;text-align:center;color:var(--grey-500);}
.empty-state svg{width:40px;height:40px;color:var(--line);margin-bottom:10px;}
.empty-state .t{font-weight:700;color:var(--grey-700);margin-bottom:4px;font-size:13.5px;}
.empty-state .d{font-size:12.5px;}

/* ---------- drawer / modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(8,24,38,.5);z-index:40;display:none;}
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:520px;max-width:94vw;background:#fff;z-index:41;
  transform:translateX(100%);transition:transform .25s ease;box-shadow:-10px 0 40px rgba(0,0,0,.2);
  display:flex;flex-direction:column;
}
.drawer.open{transform:translateX(0);}
.overlay.open{display:block;}
.drawer-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;}
.drawer-head h3{margin:0;font-size:15.5px;color:var(--navy-900);}
.drawer-body{padding:20px 22px;overflow-y:auto;flex:1;}
.drawer-foot{padding:16px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;}
.icon-btn{width:30px;height:30px;border-radius:7px;border:none;background:var(--fog-100);display:flex;align-items:center;justify-content:center;color:var(--grey-700);}
.icon-btn:hover{background:var(--fog-100);color:var(--navy-900);}
.icon-btn svg{width:15px;height:15px;}

.form-section{margin-bottom:20px;}
.form-section-title{font-size:11px;font-weight:800;color:var(--steel-600);text-transform:uppercase;letter-spacing:.6px;margin-bottom:12px;padding-bottom:6px;border-bottom:1px solid var(--fog-100);}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.form-grid .full{grid-column:1/-1;}
.chk-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.chk-row{display:flex;align-items:center;gap:8px;padding:7px 10px;background:var(--fog-50);border-radius:7px;font-size:12.5px;font-weight:600;}
.chk-row input{width:15px;height:15px;}
.los-box{background:var(--fog-50);border:1px dashed var(--line);border-radius:8px;padding:10px 12px;font-size:12.5px;color:var(--grey-700);}
.los-box b{color:var(--navy-900);}

.modal{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:460px;max-width:92vw;
  background:#fff;border-radius:14px;z-index:41;box-shadow:0 30px 70px rgba(0,0,0,.35);display:none;
}
.modal.modal-lg{width:860px;}
.modal.open{display:block;}
.modal.stacked{z-index:51;box-shadow:0 40px 90px rgba(0,0,0,.5);}
.stacked-overlay{position:fixed;inset:0;background:rgba(8,24,38,.35);z-index:50;display:none;}
.stacked-overlay.open{display:block;}
.modal-head{padding:18px 22px;border-bottom:1px solid var(--line);}
.modal-head h3{margin:0;font-size:15px;color:var(--navy-900);}
.modal-body{padding:20px 22px;max-height:60vh;overflow-y:auto;}
.modal.modal-lg .modal-body{max-height:78vh;}
.modal-foot{padding:16px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;}

.toast-wrap{position:fixed;top:20px;right:20px;z-index:60;display:flex;flex-direction:column;gap:8px;}
.toast{background:var(--navy-900);color:#fff;padding:12px 16px;border-radius:9px;font-size:13px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.25);display:flex;align-items:center;gap:8px;min-width:220px;animation:slidein .2s ease;}
.toast.err{background:var(--red-500);}
.toast.ok{background:var(--green-600);}
@keyframes slidein{from{opacity:0;transform:translateX(20px);}to{opacity:1;transform:translateX(0);}}

.link-chip{display:inline-flex;align-items:center;gap:4px;padding:4px 9px;border-radius:99px;background:var(--fog-100);font-size:11.5px;font-weight:700;color:var(--grey-700);cursor:pointer;border:none;}
.link-chip:hover{background:var(--steel-600);color:#fff;}
.role-client [onclick*="openWorkerForm("],
.role-client [onclick*="deleteWorker("],
.role-client [onclick*="openTrainingMatrixEditor("],
.role-client [onclick*="openTrainingMatrixPicker("],
.role-client [onclick*="openTrainingConfirmedForm("],
.role-client [onclick*="openProjectForm("],
.role-client [onclick*="deleteProject("],
.role-client [onclick*="deleteAllocation("],
.role-client [onclick*="openAssignWorkerForm("],
.role-client [onclick*="openPlanDateFromRemind("],
.role-client [onclick*="removeConfirmedPlan("],
.role-client [onclick*="checkAllAllocFlags("],
.role-client [onclick*="setProjectSnooze("],
.role-client [onclick*="setAllProjectSnooze("],
.role-client [onclick*="openTrainingAuditReport("],
.role-client [onclick*="printTrainingAuditReport("],
.role-client [onclick*="printProjectTrainingReport("],
.role-client [onclick*="exportProjectTrainingExcel("],
.role-client [onclick*="openFutureTrainingSummary("],
.role-client [onclick*="generateFutureTrainingSummary("],
.role-client [onclick*="openPlannedWorkersList("],
.role-client [onclick*="openProjectHistoryReport("],
.role-client [onclick*="printWatermarkedPdf("],
.role-client [onclick*="previewWatermarkedImage("],
.role-client [onclick*="editManualProjectRef("],
.role-client [onclick*="deleteManualProjectRef("],
.role-client [onclick*="addManualProjectRef("],
.role-client [onclick*="openWorkerProfileDetail("],
.role-client [onclick*="backToComplianceGroups("]{display:none !important;}
.role-client input[type=file],.role-client [onclick*="removeRefDocPhoto("],.role-client [onclick*="removeGalleryPhoto("],.role-client [onclick*="removeRowPhoto("],.role-client [onclick*="').click()"]{display:none !important;}
.role-client #project-detail input,.role-client #project-detail select,.role-client #project-detail textarea,.role-client .modal input[type=checkbox]{pointer-events:none;}
.file-locked{width:54px;height:54px;display:flex;align-items:center;justify-content:center;flex-direction:column;background:var(--fog-50);border-radius:6px;border:1px dashed var(--line);font-size:16px;color:var(--grey-500);}
.file-locked span{font-size:8.5px;margin-top:2px;}
.mini-select{padding:5px 8px;border-radius:6px;border:1px solid var(--line);font-size:12px;background:#fff;}
.progress-mini{width:70px;height:6px;background:var(--fog-100);border-radius:99px;overflow:hidden;display:inline-block;vertical-align:middle;margin-right:6px;}
.progress-mini > div{height:100%;}
.days-chip{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;}

@media(max-width:840px){
  .sidebar{transform:translateX(-100%);transition:transform .2s;}
  .sidebar.open{transform:translateX(0);}
  .main{margin-left:0;}
  .form-grid,.two-col,.chk-grid{grid-template-columns:1fr;}
  .drawer{width:100vw;}
}
.menu-toggle{display:none;background:none;border:none;color:var(--navy-900);}
@media(max-width:840px){.menu-toggle{display:flex;}}
</style>

/* ============================================================
   Best Performance Engineering — Offshore Manpower Status Dashboard
   Talks directly to the Supabase REST (PostgREST) + Auth APIs.
   No external JS libraries — plain fetch(), so this file works
   standalone with no bundler/CDN dependency.
   ============================================================ */

const SUPA_URL  = 'https://hacphjhonztcjorbgpbz.supabase.co';
const SUPA_ANON = 'sb_publishable_TYiGwXsIu-Ds4S2wwflJ9A_s08X7poh';

let session = null;      // { access_token, refresh_token, user }
let profile = null;      // row from public.profiles
let currentView = 'dashboard';

// ---------- lookup caches ----------
let CACHE = { positions: [], courses: [], workers: [], projects: [] };

/* ================= low-level fetch helper ================= */
function isAdmin() { return (profile?.role || '').toLowerCase() === 'admin'; }
/* customer account (Chevron): read-only, Chevron data only (enforced by RLS in the database),
   only Training Matrix (Matrix / แผนอบรม / เอกสารอ้างอิง) + Manpower งานปัจจุบัน/เสร็จสิ้น, no attached files */
function isClient() { return (profile?.role || '').toLowerCase() === 'client_chevron'; }
const CLIENT_ALLOWED_VIEWS = ['training', 'projects'];
const CLIENT_TRAINING_TABS = ['compliance', 'confirmed', 'refdocs'];
const CLIENT_BLOCKED_FNS = ['openWorkerForm', 'deleteWorker', 'openTrainingMatrixEditor', 'openTrainingMatrixPicker', 'openTrainingConfirmedForm',
  'openProjectForm', 'deleteProject', 'deleteAllocation', 'openAssignWorkerForm', 'saveAssignWorkerBulk', 'openPlanDateFromRemind', 'savePlanDate',
  'removeConfirmedPlan', 'addConfirmedRow', 'addExtraRow', 'checkAllAllocFlags', 'setProjectSnooze', 'setAllProjectSnooze',
  'openTrainingAuditReport', 'printTrainingAuditReport', 'printProjectTrainingReport', 'exportProjectTrainingExcel',
  'openFutureTrainingSummary', 'generateFutureTrainingSummary', 'openPlannedWorkersList', 'openProjectHistoryReport',
  'previewWatermarkedImage', 'printWatermarkedPdf', 'openWorkerProfileDetail', 'editManualProjectRef', 'deleteManualProjectRef', 'addManualProjectRef',
  'removeRefDocPhoto', 'handleRefDocUpload', 'removeGalleryPhoto', 'removeRowPhoto', 'handlePhotoUpload',
  'saveWorker', 'saveTrainingRecord', 'saveTrainingConfirmed', 'saveProject', 'saveAllTmeRows', 'deleteTmeRow', 'saveMandatoryAll'];
function lockForClient() {
  document.body.classList.toggle('role-client', isClient());
  if (!isClient()) return;
  const no = () => toast('บัญชีนี้ดูข้อมูลได้อย่างเดียว', 'err');
  CLIENT_BLOCKED_FNS.forEach(n => { if (typeof window[n] === 'function') window[n] = no; });
}
async function supa(path, opts = {}) {
  const method = (opts.method || 'GET').toUpperCase();
  // client-side UX guard only — the real security boundary is the RLS
  // policies on each table, which already reject this at the database level
  // for non-admins; this just avoids a confusing raw API error reaching the UI
  const healthWrite = /\/rest\/v1\/(rpc\/)?health_/.test(path) && hasHealthAccess(); // health team may write health tables even without admin
  if (method !== 'GET' && profile && !isAdmin() && !healthWrite) {
    toast('บัญชีนี้เป็น Viewer (ดูอย่างเดียว) ไม่มีสิทธิ์แก้ไขข้อมูล', 'err');
    throw new Error('Viewer accounts cannot modify data.');
  }
  const headers = {
    apikey: SUPA_ANON,
    'Content-Type': 'application/json',
    ...(session ? { Authorization: 'Bearer ' + session.access_token } : {}),
    ...(opts.headers || {})
  };
  const res = await fetch(SUPA_URL + path, { ...opts, headers });
  const raw = await res.text();
  let data = null;
  try { data = raw ? JSON.parse(raw) : null; } catch (e) { data = raw; }
  if (!res.ok) {
    const msg = (data && (data.message || data.error_description || data.msg)) || res.statusText;
    throw new Error(msg);
  }
  return data;
}
/* fetches ALL rows for a query, looping past PostgREST's default 1000-row-per-
   request cap — use this for any table that can realistically grow beyond
   1000 rows (e.g. worker_training_records), otherwise results silently
   truncate with no error, which is much worse than the extra round trips */
async function supaAll(path, opts = {}) {
  const pageSize = 1000;
  let offset = 0;
  let all = [];
  while (true) {
    const sep = path.includes('?') ? '&' : '?';
    const page = await supa(`${path}${sep}limit=${pageSize}&offset=${offset}`, opts);
    if (!Array.isArray(page)) return page; // not a row-list response (e.g. an error object) — return as-is
    all = all.concat(page);
    if (page.length < pageSize) break;
    offset += pageSize;
  }
  return all;
}

/* ================= remember-me / persistent session =================
   This file is meant to be opened as a standalone .html (outside the
   Claude.ai sandbox), so localStorage is safe to use here — it's the
   only way to avoid re-typing the password every time. We store only
   the Supabase refresh_token (never the password) plus the email for
   convenience, and silently exchange it for a fresh session on load. */
const REMEMBER_KEY = 'bpe_manpower_remember_v1';
function saveRememberedSession(email, refreshToken) {
  try { localStorage.setItem(REMEMBER_KEY, JSON.stringify({ email, refreshToken })); } catch (e) {}
}
function clearRememberedSession() {
  try { localStorage.removeItem(REMEMBER_KEY); } catch (e) {}
}
function loadRememberedSession() {
  try { const raw = localStorage.getItem(REMEMBER_KEY); return raw ? JSON.parse(raw) : null; } catch (e) { return null; }
}
async function tryAutoLogin() {
  const remembered = loadRememberedSession();
  if (!remembered) return false;
  if (remembered.email) { const emailEl = document.getElementById('login-email'); if (emailEl) emailEl.value = remembered.email; }
  if (!remembered.refreshToken) return false;
  try {
    const res = await fetch(SUPA_URL + '/auth/v1/token?grant_type=refresh_token', {
      method: 'POST',
      headers: { apikey: SUPA_ANON, 'Content-Type': 'application/json' },
      body: JSON.stringify({ refresh_token: remembered.refreshToken })
    });
    const data = await res.json();
    if (!res.ok) throw new Error('expired');
    session = data;
    saveRememberedSession(data.user?.email || remembered.email, data.refresh_token);
    await loadProfile();
    enterApp();
    return true;
  } catch (e) {
    clearRememberedSession();
    return false;
  }
}

/* ================= auth ================= */
async function doLogin() {
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const remember = document.getElementById('login-remember').checked;
  const errBox = document.getElementById('login-error');
  errBox.style.display = 'none';
  const btn = document.getElementById('login-btn');
  btn.textContent = 'กำลังเข้าสู่ระบบ...'; btn.disabled = true;
  try {
    const res = await fetch(SUPA_URL + '/auth/v1/token?grant_type=password', {
      method: 'POST',
      headers: { apikey: SUPA_ANON, 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error_description || data.msg || 'อีเมลหรือรหัสผ่านไม่ถูกต้อง');
    session = data;
    if (remember) saveRememberedSession(email, data.refresh_token); else clearRememberedSession();
    await loadProfile();
    enterApp();
  } catch (e) {
    errBox.textContent = e.message;
    errBox.style.display = 'block';
  } finally {
    btn.textContent = 'เข้าสู่ระบบ'; btn.disabled = false;
  }
}

async function doForgot() {
  const email = document.getElementById('login-email').value.trim();
  if (!email) { alert('กรอกอีเมลของคุณในช่องด้านบนก่อน แล้วกดลิงก์นี้อีกครั้ง'); return; }
  try {
    await fetch(SUPA_URL + '/auth/v1/recover', {
      method: 'POST',
      headers: { apikey: SUPA_ANON, 'Content-Type': 'application/json' },
      body: JSON.stringify({ email })
    });
    alert('ถ้าอีเมลนี้มีอยู่ในระบบ เราได้ส่งลิงก์รีเซ็ตรหัสผ่านไปให้แล้ว');
  } catch (e) { alert('ส่งคำขอไม่สำเร็จ: ' + e.message); }
}

async function loadProfile() {
  try {
    const rows = await supa('/rest/v1/profiles?select=*&id=eq.' + session.user.id);
    profile = (rows && rows[0]) || { email: session.user.email, role: 'viewer' };
  } catch (e) { profile = { email: session.user.email, role: 'viewer' }; }
}

function doLogout() {
  if (isClient()) { clearRememberedSession(); location.reload(); return; } // restore the functions the client lock replaced
  session = null; profile = null;
  clearRememberedSession();
  document.getElementById('app-shell').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('login-email').value = '';
  document.getElementById('login-password').value = '';
}

function enterApp() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app-shell').style.display = 'block';
  document.getElementById('sidebar-user').textContent = profile.email || session.user.email;
  document.getElementById('sidebar-role').textContent = isClient() ? 'CHEVRON · VIEW ONLY' : (profile.role || 'viewer').toUpperCase();
  lockForClient();
  if (isClient()) { trainingTab = 'compliance'; window._complianceSelectedGroup = 'Chevron'; }
  buildNav();
  loadLookups().then(() => navigate(isAdmin() ? 'dashboard' : isClient() ? 'training' : 'projects'));
}

async function loadLookups() {
  try {
    CACHE.positions = await supa('/rest/v1/positions?select=*&order=title.asc');
    CACHE.courses = await supa('/rest/v1/courses?select=*&order=client_scope.asc,sort_order.asc');
  } catch (e) { toast(e.message, 'err'); }
}

async function uploadToStorage(fileOrBlob, folder, filenameHint) {
  const name = filenameHint || fileOrBlob.name || 'file.jpg';
  const ext = (name.split('.').pop() || 'jpg').toLowerCase();
  const path = `${folder}/${Date.now()}_${Math.random().toString(36).slice(2,8)}.${ext}`;
  const res = await fetch(`${SUPA_URL}/storage/v1/object/worker-files/${path}`, {
    method: 'POST',
    headers: {
      apikey: SUPA_ANON,
      Authorization: 'Bearer ' + session.access_token,
      'Content-Type': fileOrBlob.type || 'application/octet-stream',
      'x-upsert': 'true'
    },
    body: fileOrBlob
  });
  if (!res.ok) { const t = await res.text(); throw new Error(t); }
  return `${SUPA_URL}/storage/v1/object/public/worker-files/${path}`;
}

/* Draws the watermark INTO the pixels at view time (canvas -> blob URL), so
   "Save image as" gives a watermarked copy. The original in storage stays
   clean, which also means old photos get the watermark too. Results are cached
   and large photos are downscaled, so re-opening is instant. */
const WM_LABEL = 'Best Performance Engineering — PREVIEW ONLY';
async function renderWatermarkedBlobUrl(url) {
  window._wmCache = window._wmCache || {};
  if (window._wmCache[url]) return window._wmCache[url];
  const img = await new Promise((resolve, reject) => {
    const im = new Image();
    im.crossOrigin = 'anonymous';
    im.onload = () => resolve(im);
    im.onerror = () => reject(new Error('โหลดรูปไม่สำเร็จ'));
    im.src = url;
  });
  // keep the image at its full original resolution — downscaling here was
  // what made zooming look blurry/pixelated compared to before
  const w = img.naturalWidth, h = img.naturalHeight;
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(img, 0, 0, w, h);
  ctx.save();
  ctx.translate(w / 2, h / 2);
  ctx.rotate(-Math.PI / 6);
  ctx.font = `bold ${Math.max(18, Math.round(w * 0.045))}px sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.globalAlpha = 0.30;
  ctx.fillStyle = '#0B2942';
  ctx.fillText(WM_LABEL, 0, 0); // single centered line
  ctx.restore();
  const blob = await new Promise((resolve, reject) => canvas.toBlob(b => b ? resolve(b) : reject(new Error('export failed')), 'image/jpeg', 0.97));
  return (window._wmCache[url] = URL.createObjectURL(blob));
}
function drawWatermark(ctx, w, h) {
  ctx.save();
  ctx.translate(w / 2, h / 2);
  ctx.rotate(-Math.PI / 6);
  ctx.font = `bold ${Math.max(18, Math.round(w * 0.045))}px sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.globalAlpha = 0.30;
  ctx.fillStyle = '#0B2942';
  ctx.fillText(WM_LABEL, 0, 0); // single centered line
  ctx.restore();
}
/* PDFs can't be watermarked by an overlay (the browser's own Save button gets
   the clean file), so each page is rendered to an image with the watermark
   drawn into it. pdf.js is loaded from a CDN on first use. */
const PDFJS_BASE = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
function loadPdfJs() {
  const existing = window.pdfjsLib || window['pdfjs-dist/build/pdf'];
  if (existing) return Promise.resolve(existing);
  if (window._pdfJsPromise) return window._pdfJsPromise;
  window._pdfJsPromise = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = PDFJS_BASE + 'pdf.min.js';
    s.onload = () => {
      const lib = window.pdfjsLib || window['pdfjs-dist/build/pdf'];
      if (!lib) { window._pdfJsPromise = null; reject(new Error('pdf.js not available')); return; }
      lib.GlobalWorkerOptions.workerSrc = PDFJS_BASE + 'pdf.worker.min.js';
      resolve(lib);
    };
    s.onerror = () => { window._pdfJsPromise = null; reject(new Error('โหลดตัวอ่าน PDF ไม่สำเร็จ')); };
    document.head.appendChild(s);
  });
  return window._pdfJsPromise;
}
const WM_PDF_MAX_PAGES = 40;
async function renderWatermarkedPdfPages(url, onPage) {
  window._wmPdfCache = window._wmPdfCache || {};
  if (window._wmPdfCache[url]) { window._wmPdfCache[url].pages.forEach((u, i) => onPage(u, i, window._wmPdfCache[url].total)); return window._wmPdfCache[url]; }
  const lib = await loadPdfJs();
  const pdf = await lib.getDocument({ url }).promise;
  const total = pdf.numPages;
  const limit = Math.min(total, WM_PDF_MAX_PAGES);
  const pages = [];
  for (let i = 1; i <= limit; i++) {
    const page = await pdf.getPage(i);
    const base = page.getViewport({ scale: 1 });
    const scale = Math.min(3, 2400 / base.width); // higher-res render so zooming in stays crisp
    const viewport = page.getViewport({ scale });
    const canvas = document.createElement('canvas');
    canvas.width = Math.round(viewport.width); canvas.height = Math.round(viewport.height);
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    await page.render({ canvasContext: ctx, viewport }).promise;
    drawWatermark(ctx, canvas.width, canvas.height);
    const blob = await new Promise((resolve, reject) => canvas.toBlob(b => b ? resolve(b) : reject(new Error('export failed')), 'image/jpeg', 0.95));
    const blobUrl = URL.createObjectURL(blob);
    pages.push(blobUrl);
    onPage(blobUrl, i - 1, total);
  }
  return (window._wmPdfCache[url] = { pages, total });
}
function printWatermarkedPdf(url) {

  if (!cached) { toast('รอโหลดเอกสารให้เสร็จก่อน', 'err'); return; }
  const win = window.open('', '_blank');

/* A PDF made only of the already-watermarked page images, so the saved file carries the watermark.
   Hand-written minimal PDF (one JPEG per page) — no library needed. */
async function buildPdfFromJpegUrls(blobUrls) {
  const enc = new TextEncoder();
  const imgs = [];
  for (const u of blobUrls) {
    const bytes = new Uint8Array(await (await fetch(u)).arrayBuffer());
    const dim = await new Promise((resolve, reject) => { const im = new Image(); im.onload = () => resolve({ w: im.naturalWidth, h: im.naturalHeight }); im.onerror = reject; im.src = u; });
    imgs.push({ bytes, w: dim.w, h: dim.h });
  }
  const parts = []; let offset = 0; const offsets = [];
  const push = d => { const b = typeof d === 'string' ? enc.encode(d) : d; parts.push(b); offset += b.length; };
  const startObj = n => { offsets[n] = offset; push(`${n} 0 obj\n`); };
  const pageW = 595.28;
  const kids = imgs.map((_, i) => `${3 + i * 3} 0 R`).join(' ');
  push('%PDF-1.4\n');
  startObj(1); push('<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
  startObj(2); push(`<< /Type /Pages /Kids [${kids}] /Count ${imgs.length} >>\nendobj\n`);
  imgs.forEach((im, i) => {
    const pageObj = 3 + i * 3, contentObj = pageObj + 1, imageObj = pageObj + 2;
    const pageH = +(pageW * im.h / im.w).toFixed(2);
    startObj(pageObj);
    push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pageW} ${pageH}] /Resources << /XObject << /Im0 ${imageObj} 0 R >> >> /Contents ${contentObj} 0 R >>\nendobj\n`);
    const content = `q ${pageW} 0 0 ${pageH} 0 0 cm /Im0 Do Q`;
    startObj(contentObj); push(`<< /Length ${content.length} >>\nstream\n${content}\nendstream\nendobj\n`);
    startObj(imageObj);
    push(`<< /Type /XObject /Subtype /Image /Width ${im.w} /Height ${im.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${im.bytes.length} >>\nstream\n`);
    push(im.bytes); push('\nendstream\nendobj\n');
  });
  const objCount = 2 + imgs.length * 3;
  const xrefAt = offset;
  let xref = `xref\n0 ${objCount + 1}\n0000000000 65535 f \n`;
  for (let n = 1; n <= objCount; n++) xref += String(offsets[n]).padStart(10, '0') + ' 00000 n \n';
  push(xref + `trailer\n<< /Size ${objCount + 1} /Root 1 0 R >>\nstartxref\n${xrefAt}\n%%EOF\n`);
  return new Blob(parts, { type: 'application/pdf' });
}

   (+ _2, _3 … when one certificate has several files). Taken from the thumbnail
   itself, or — inside the Training Matrix editor — from the row it sits in. */
function thumbFileBase(el) {
  const base = el.dataset.fb || fileBaseFromEditorRow(el);
  const n = Number(el.dataset.n || 1), i = Number(el.dataset.i || 0);

function fileBaseFromEditorRow(el) {
  const row = el.closest('.tme-cert-row, .tme-extra-row');
  if (!row) return '';
  const wid = document.getElementById('tme-worker-id')?.value;
  const worker = (workersData.find(w => w.id === wid) || {}).name
    || ((window._complianceOverall || []).find(o => o.worker_id === wid) || {}).name || '';

    course = (CACHE.courses.find(x => String(x.id) === row.dataset.courseId) || {}).course_name || '';

/* Group -> Position -> Pax + headcount-with-a-plan per upcoming month, matching
   the reference "Grop <name> | Pax | Sep | Oct | Nov | Dec" layout */
let dashSelectedMonth = null;
function dashMonthOptions() {
  const MONTHS_RANGE = 6;
  const today = new Date();
  const months = [];
  for (let i = 0; i < MONTHS_RANGE; i++) {
    const d = new Date(today.getFullYear(), today.getMonth() + i, 1);
    months.push({ key: `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`, label: d.toLocaleDateString('th-TH', { month: 'long', year: 'numeric' }) });
  }
  return months;
}
function changeDashMonthFilter(month) {
  dashSelectedMonth = month;
  const wrap = document.getElementById('dash-matrix-wrap');
  if (wrap) wrap.innerHTML = renderPositionGroupMonthMatrix(window._dashMatrixWorkers, window._dashMatrixAllocs);
}
function renderPositionGroupMonthMatrix(workers, allocs) {
  const months = dashMonthOptions();
  if (!dashSelectedMonth) dashSelectedMonth = months[0].key;
  const selMonth = dashSelectedMonth;
  const monthLabel = (months.find(m => m.key === selMonth) || {}).label || selMonth;

  const workerMonths = {};
  allocs.forEach(a => {
    if (!a.mob_date) return;
    const key = a.mob_date.slice(0, 7);
    (workerMonths[a.worker_id] = workerMonths[a.worker_id] || new Set()).add(key);
  });
  // a worker can now hold more than one position — count them under each
  const grid = {};
  workers.forEach(w => {
    const group = bigGroupName(w.group_name);
    const positions = (w.position_title || 'ไม่ระบุตำแหน่ง').split(',').map(s => s.trim()).filter(Boolean);
    const plannedThisMonth = !!(workerMonths[w.id] && workerMonths[w.id].has(selMonth));
    positions.forEach(pos => {
      grid[group] = grid[group] || {};
      grid[group][pos] = grid[group][pos] || { pax: 0, plannedThisMonth: 0 };
      grid[group][pos].pax++;
      if (plannedThisMonth) grid[group][pos].plannedThisMonth++;
    });
  });
  const groupNames = Object.keys(grid).sort();

  const header = `
    <div class="panel">
      <div class="panel-head">
        <h3>👷 ตำแหน่งงาน — Pax คงเหลือรายเดือน</h3>
        <div style="display:flex;align-items:center;gap:8px;">
          <span class="cell-sub">เดือนปัจจุบันที่แสดง:</span>

const DONUT_COLORS = ['#3B82C4', '#F5A623', '#2E9E6D', '#BD10E0', '#9B9B9B', '#E0454C'];
function renderDonutChart(items, size) {
  size = size || 210;
  const total = items.reduce((s, r) => s + r.value, 0) || 1;
  const strokeWidth = Math.round(size * 0.17);
  const radius = size/2 - strokeWidth/2 - 2, cx = size/2, cy = size/2, circumference = 2 * Math.PI * radius;
  let offset = 0;
  const segments = items.map((r, i) => {
    const frac = r.value / total;
    const dash = frac * circumference;
    const seg = `<circle cx="${cx}" cy="${cy}" r="${radius}" fill="none" stroke="${DONUT_COLORS[i % DONUT_COLORS.length]}" stroke-width="${strokeWidth}" stroke-dasharray="${dash} ${circumference - dash}" stroke-dashoffset="${-offset}" transform="rotate(-90 ${cx} ${cy})"/>`;
    offset += dash;
    return seg;
  }).join('');
  const legend = items.map((r, i) => `
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">
      <span style="width:13px;height:13px;border-radius:3px;background:${DONUT_COLORS[i % DONUT_COLORS.length]};display:inline-block;flex-shrink:0;"></span>
      <span style="font-size:14px;">${esc(r.label)}: <b>${r.value}</b> คน (${Math.round(r.value/total*100)}%)</span>
    </div>`).join('');
  return `<div style="display:flex;gap:28px;align-items:center;flex-wrap:wrap;">
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${segments}<text x="${cx}" y="${cy}" text-anchor="middle" dominant-baseline="central" font-size="${Math.round(size*0.15)}" font-weight="800" fill="var(--navy-900)">${total}</text></svg>
    <div>${legend}</div>
  </div>`;
}

function applyWorkerDocAlert(key, kind) {
  DOC_ALERT_DEFS.forEach(d => { const el = document.getElementById(d.filterId); if (el) el.value = ''; });
  window._workerDocAlertAny = false;
  if (key === 'any') window._workerDocAlertAny = true;
  else if (key !== 'clear') {
    const def = DOC_ALERT_DEFS.find(d => d.key === key);
    const el = document.getElementById(def.filterId); if (el) el.value = def[kind];
  }
  filterWorkerTable();
}
function filterWorkerTable() {
  const q = document.getElementById('worker-search-input')?.value || '';
  const dept = document.getElementById('wf-dept').value;
  const posFilter = document.getElementById('wf-position').value;
  const group = document.getElementById('wf-group').value;
  const passportF = document.getElementById('wf-passport').value;
  const dlogF = document.getElementById('wf-dlog').value;
  const ospF = document.getElementById('wf-osp').value;
  const mcuF = document.getElementById('wf-mcu').value;
  const bosietF = document.getElementById('wf-bosiet')?.value || '';
  const ospBosietF = document.getElementById('wf-ospbosiet')?.value || '';
  const ffdF = document.getElementById('wf-ffd')?.value || '';
  const offshoreFilter = document.getElementById('wf-offshore').value;
  const mobFilter = document.getElementById('wf-mob').value;
  const demobFilter = document.getElementById('wf-demob').value;
  const restFilter = document.getElementById('wf-restdays').value;
  let rows = workersData.filter(w => {
    const hay = [w.id_card, w.name, w.domicile, w.client_type, w.id_passport, w.position_title, w.company, w.group_name, w.group_name ? bigGroupName(w.group_name) : '', w.employment_status,
      w.is_borrowed ? `พนักงานยืม ยืม ${w.borrowed_from || ''} ${w.contract_ended ? 'หมดสัญญา' : ''}` : ''];
    return chipsMatch('worker', hay) && matchesQuery(hay, q);
  });
  if (dept) rows = rows.filter(w => w.company === dept);
  if (posFilter) {
    const posTitle = (CACHE.positions.find(p => String(p.id) === posFilter) || {}).title || '';
    rows = rows.filter(w => (w.position_title || '').split(',').map(s=>s.trim()).includes(posTitle));
  }
  if (group) rows = rows.filter(w => w.group_name === group);
  if (passportF) rows = rows.filter(w => w.passport_status === passportF);
  if (dlogF) rows = rows.filter(w => w.dlog_status === dlogF);
  if (ospF) rows = rows.filter(w => w.osp_status === ospF);
  if (mcuF) rows = rows.filter(w => w.mcu_status === mcuF);
  if (bosietF) rows = rows.filter(w => w.bosiet_status === bosietF);
  if (ospBosietF) rows = rows.filter(w => w.osp_bosiet_status === ospBosietF);
  if (ffdF) rows = rows.filter(w => w.ffd_status === ffdF);
  if (offshoreFilter) rows = rows.filter(w => (workerOffshoreMap[w.id]?.offshore_status || '') === offshoreFilter);
  if (mobFilter) rows = rows.filter(w => (workerOffshoreMap[w.id]?.mob_date || '').slice(0,7) === mobFilter);
  if (demobFilter) rows = rows.filter(w => (workerOffshoreMap[w.id]?.demob_date || '').slice(0,7) === demobFilter);
  if (window._workerDocAlertAny) rows = rows.filter(workerHasDocAlert);
  if (restFilter) rows = rows.filter(w => {
    const days = workerRestGapMap[w.id]?.rest_days;
    if (restFilter === 'none') return days == null;
    if (days == null) return false;
    if (restFilter === 'lt14') return days < 14;
    if (restFilter === '14to60') return days >= 14 && days <= 60;
    if (restFilter === 'gt60') return days > 60;
    return true;
  });
  paintWorkerTable(rows);
  paintWorkerDocAlerts(); // keeps the highlighted chip in step with the header drop-downs
}
/* a plan only counts as "active" if it's happening now or still upcoming — a

function isCurrentOrFuturePlan(off) {
  if (!off || !off.mob_date) return false;
  const today = new Date().toISOString().slice(0, 10);
  return !off.demob_date || off.demob_date >= today;
}

async function saveWorker(id) {
  const companySel = document.getElementById('f-company').value;
  const companyRaw = companySel === '__other' ? (document.getElementById('f-company-other').value.trim() || null) : companySel;
  const groupSel = document.getElementById('f-group').value;
  const groupRaw = groupSel === '__other' ? (document.getElementById('f-group-other').value.trim() || null) : groupSel;

  const positionSel = document.querySelector('.f-position-select');
  const selectedPositionId = positionSel && positionSel.value ? Number(positionSel.value) : null;
  if (!selectedPositionId) { toast('กรุณาเลือกตำแหน่ง', 'err'); return; }
  const uniquePositionIdsArr = [selectedPositionId];

  const payload = {
    photo_url: document.getElementById('f-photo-url').value || null,
    company: companyRaw,
    name: document.getElementById('f-name').value.trim(),
    position_id: uniquePositionIdsArr[0],
    group_name: groupRaw,
    date_of_birth: document.getElementById('f-dob').value || null,
    id_card: document.getElementById('f-idcard').value.trim() || null,
    id_passport: document.getElementById('f-idpassport').value.trim() || null,
    passport_exp: document.getElementById('f-passportexp').value || null,
    mcu_client_tags: Array.from(document.querySelectorAll('.f-mcuclienttag:checked')).map(c => c.value),
    start_date: document.getElementById('f-startdate').value || null,
    domicile: document.getElementById('f-domicile').value.trim() || null,
    permanent_address: document.getElementById('f-address').value.trim() || null,
    phone_number: document.getElementById('f-phone').value.trim() || null,
    travel_allowance: Number(document.getElementById('f-travel').value) || 0,
    emergency_contact: document.getElementById('f-emergency').value.trim() || null,
    // a borrowed worker whose contract ended drops out of every active list exactly like a resigned one
    employment_status: document.getElementById('f-resigned').checked || (document.getElementById('f-borrowed').checked && document.getElementById('f-contract-ended').checked) ? 'Resigned' : 'Active',
    is_borrowed: document.getElementById('f-borrowed').checked,
    borrowed_from: document.getElementById('f-borrowed').checked ? (document.getElementById('f-borrowed-from').value.trim() || null) : null,
    contract_end_date: document.getElementById('f-borrowed').checked ? (document.getElementById('f-contract-end').value || null) : null,
    contract_ended: document.getElementById('f-borrowed').checked && document.getElementById('f-contract-ended').checked,
    updated_at: new Date().toISOString(),
  };

  if (!payload.name) { toast('กรุณากรอกชื่อพนักงาน', 'err'); return; }

  try {
    let workerId = id;
    if (id) {
      await supa('/rest/v1/workers?id=eq.' + id, { method: 'PATCH', body: JSON.stringify(payload) });
      toast('บันทึกข้อมูลพนักงานแล้ว');
    } else {
      const res = await supa('/rest/v1/workers', { method: 'POST', headers: { Prefer: 'return=representation' }, body: JSON.stringify(payload) });
      workerId = res[0].id;
      toast('เพิ่มพนักงานใหม่แล้ว');
    }
    // sync the multi-position junction table: replace with the current selection
    await supa(`/rest/v1/worker_positions?worker_id=eq.${workerId}`, { method: 'DELETE' });
    await supa('/rest/v1/worker_positions', {
      method: 'POST', headers: { Prefer: 'return=minimal' },
      body: JSON.stringify(uniquePositionIdsArr.map(pid => ({ worker_id: workerId, position_id: pid })))
    });
    closeAllOverlays();
    renderWorkers();
  } catch (e) { toast('บันทึกไม่สำเร็จ: ' + e.message, 'err'); }
}

async function deleteWorker(id) {
  if (!confirm('ยืนยันการลบพนักงานคนนี้? ข้อมูลที่เกี่ยวข้อง (ใบเซอร์, ประวัติโปรเจกต์) จะถูกลบด้วย')) return;
  try {
    await supa('/rest/v1/workers?id=eq.' + id, { method: 'DELETE' });
    toast('ลบข้อมูลพนักงานแล้ว');
    closeAllOverlays();
    renderWorkers();
  } catch (e) { toast('ลบไม่สำเร็จ: ' + e.message, 'err'); }
}

let trainingTab = 'record';
async function renderTraining() {
  const c = document.getElementById('content');
  if (isClient() && !CLIENT_TRAINING_TABS.includes(trainingTab)) trainingTab = 'compliance';
  c.innerHTML = `
    <div class="tabs tabs-sticky">
      <button class="tab-btn ${trainingTab==='record'?'active':''}" onclick="switchTrainingTab('record')">📊 Training Record</button>
      <button class="tab-btn ${trainingTab==='compliance'?'active':''}" onclick="window._complianceSelectedGroup=null;switchTrainingTab('compliance')">Training Confirmed / Matrix</button>
      <button class="tab-btn ${trainingTab==='remind'?'active':''}" onclick="switchTrainingTab('remind')">🔔 Remind</button>
      <button class="tab-btn ${trainingTab==='confirmed'?'active':''}" onclick="switchTrainingTab('confirmed')">📅 แผนอบรม (Confirmed)</button>
      <button class="tab-btn ${trainingTab==='mandatory'?'active':''}" onclick="switchTrainingTab('mandatory')">⚙️ หลักสูตรบังคับต่อตำแหน่ง</button>
      <button class="tab-btn ${trainingTab==='refdocs'?'active':''}" onclick="switchTrainingTab('refdocs')">📄 เอกสารอ้างอิง</button>
    </div>

  if (isClient()) c.querySelectorAll('.tabs-sticky .tab-btn').forEach(b => {
    const m = (b.getAttribute('onclick') || '').match(/switchTrainingTab\('(\w+)'\)/);
    if (m && !CLIENT_TRAINING_TABS.includes(m[1])) b.remove();
    else if (m && m[1] === 'compliance') b.setAttribute('onclick', "switchTrainingTab('compliance')");
  });
  updateTrainingStickyOffsets();
  await paintTrainingTab();
  updateTrainingStickyOffsets();
}
function updateTrainingStickyOffsets() {
  const topbar = document.querySelector('.topbar');
  const tabs = document.querySelector('.tabs.tabs-sticky');
  if (!topbar) return;
  const topbarPinned = getComputedStyle(topbar).position === 'sticky'; // not pinned on narrow screens
  const h1 = topbarPinned ? topbar.offsetHeight : 0;
  const h2 = tabs ? tabs.offsetHeight : 0;
  document.documentElement.style.setProperty('--tm-top1', h1 + 'px');
  document.documentElement.style.setProperty('--tm-top2', (h1 + h2) + 'px');
}
window.addEventListener('resize', updateTrainingStickyOffsets);
function switchTrainingTab(t) { if (isClient() && !CLIENT_TRAINING_TABS.includes(t)) t = 'compliance'; trainingTab = t; renderTraining(); }
async function paintTrainingTab() {
  const body = document.getElementById('training-tab-body');
  if (trainingTab === 'record') return paintTrainingRecord(body);
  if (trainingTab === 'compliance') return paintCompliance(body);
  if (trainingTab === 'remind') return paintRemind(body);
  if (trainingTab === 'confirmed') return paintConfirmed(body);
  if (trainingTab === 'mandatory') return paintMandatory(body);
  if (trainingTab === 'refdocs') return paintRefDocs(body);
}

        <div style="display:flex;gap:20px;flex-wrap:wrap;">
          ${groupNames.length ? groupNames.map(g => `
            <div style="flex:1;min-width:200px;text-align:center;">
              <div style="font-weight:700;color:${GROUP_COLORS[g]||'#888'};margin-bottom:6px;">${esc(g)}</div>
              ${renderDonutChart([{ label: 'Complete', value: counts[g].complete }, { label: 'Incomplete', value: counts[g].incomplete }], 130)}
            </div>`).join('') : `<div class="empty-state"><div class="d">ยังไม่มีข้อมูล</div></div>`}
        </div>
      </div>
    </div>
    <div class="panel">
      <div class="panel-head"><h3>สรุปตามกลุ่มงาน</h3></div>
      <div class="panel-body">
        <div style="display:flex;gap:14px;flex-wrap:wrap;">
          ${groupNames.length ? groupNames.map(g => `
            <div onclick="jumpToComplianceGroup('${esc(g)}')" style="cursor:pointer;flex:1;min-width:170px;border-radius:10px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.08);">
              <div style="background:${GROUP_COLORS[g]||'#888'};color:#fff;padding:10px 14px;font-weight:700;">${esc(g)}</div>
              <div style="padding:12px 14px;background:#fff;">
                <div style="display:flex;justify-content:space-between;margin-bottom:4px;"><span class="cell-sub">Complete</span><b style="color:var(--green-600);">${counts[g].complete}</b></div>
                <div style="display:flex;justify-content:space-between;margin-bottom:4px;"><span class="cell-sub">Incomplete</span><b style="color:var(--red-500);">${counts[g].incomplete}</b></div>

        </table>
      </div>`;
  }).join('');
  win.document.write(`<!DOCTYPE html><html><head><meta charset="utf-8"><title>Training Matrix Audit Report</title>

/* layered search (Training Matrix / Remind / แผนอบรม): each term the user confirms (Enter / ค้นหา) becomes a chip
   in the box; chips stack (all must match) or, if chosen, any one may match — the text still being typed narrows on top.
   key = 'compliance' | 'remind' | 'confirmed' → ids <key>-search-input / <key>-chips / <key>-chip-mode */
const CHIP_FILTERS = { compliance: 'paintComplianceFilter', remind: 'paintRemindFilter', confirmed: 'paintConfirmedFilter', worker: 'filterWorkerTable', health: 'paintHealthFilter' };
window._chips = window._chips || {}; window._chipMode = window._chipMode || {};
const CHIP_PLACEHOLDER = 'พิมพ์ ID / ชื่อ / ตำแหน่ง / หลักสูตร / สถานที่... แล้วกด Enter';
function chipSearchHtml(key) {
  return `
      <div class="chip-search" onclick="document.getElementById('${key}-search-input').focus()">

        <span id="${key}-chips" style="display:contents;"></span>
        <input id="${key}-search-input" placeholder="${CHIP_PLACEHOLDER}" oninput="chipRefilter('${key}')" onkeydown="chipSearchKey(event,'${key}')">
      </div>
      <button class="btn btn-primary btn-sm" style="width:auto;" onclick="addSearchChip('${key}')">🔍 ค้นหา</button>
      <select class="mini-select" id="${key}-chip-mode" title="เมื่อมีหลายเงื่อนไข" onchange="window._chipMode['${key}']=this.value;chipRefilter('${key}')">
        <option value="and">ตรงทุกเงื่อนไข (กรองซ้อน)</option>
        <option value="or">ตรงเงื่อนไขใดก็ได้</option>
      </select>`;
}
/* call right after the toolbar is put on the page: shows chips kept from before + the chosen mode */
function initChipSearch(key) {
  const modeEl = document.getElementById(`${key}-chip-mode`);
  if (modeEl && window._chipMode[key]) modeEl.value = window._chipMode[key];
  paintSearchChips(key);
}
function chipRefilter(key) {
  const fn = window[CHIP_FILTERS[key]];
  if (fn) fn(document.getElementById(`${key}-search-input`)?.value || '');
}
/* does this row's text pass the chips? (the live text is still checked by the caller with matchesQuery) */
function chipsMatch(key, hay) {
  const chips = window._chips[key] || [];
  if (!chips.length) return true;
  const hit = c => matchesQuery(hay, c);
  return window._chipMode[key] === 'or' ? chips.some(hit) : chips.every(hit);
}
function chipSearchKey(e, key) {
  if (e.key === 'Enter') { e.preventDefault(); addSearchChip(key); }
  else if (e.key === 'Backspace' && !e.target.value && (window._chips[key] || []).length) {
    window._chips[key].pop(); paintSearchChips(key); chipRefilter(key);
  }
}
function addSearchChip(key) {
  const input = document.getElementById(`${key}-search-input`);
  const term = (input?.value || '').trim();
  if (!term) { input?.focus(); return; }
  const list = window._chips[key] = window._chips[key] || [];
  if (!list.some(c => c.toLowerCase() === term.toLowerCase())) list.push(term);
  input.value = '';
  paintSearchChips(key); chipRefilter(key); input.focus();
}
function removeSearchChip(key, i) { (window._chips[key] || []).splice(i, 1); paintSearchChips(key); chipRefilter(key); }
function clearSearchChips(key) {
  window._chips[key] = []; const input = document.getElementById(`${key}-search-input`); if (input) input.value = '';
  paintSearchChips(key); chipRefilter(key);

function paintSearchChips(key) {

    + (chips.length > 1 ? `<button type="button" class="btn btn-ghost btn-sm" style="padding:2px 6px;font-size:11.5px;" onclick="event.stopPropagation();clearSearchChips('${key}')">ล้างทั้งหมด</button>` : '');

const NO_MATCH_HTML = `<div class="empty-state"><div class="t">ไม่พบรายชื่อที่ตรงกับเงื่อนไข</div><div class="d">ลองเอาบางเงื่อนไขออก หรือเปลี่ยนเป็น “ตรงเงื่อนไขใดก็ได้”</div></div>`;

function paintComplianceFilter(q) {
  const statusFilterEl = document.getElementById('compliance-status-filter');
  const statusFilter = statusFilterEl ? statusFilterEl.value : '';
  const rows = (window._complianceOverall||[]).filter(r => {
    if (window._complianceSelectedGroup && (window._complianceWorkerGroup[r.worker_id]||'ไม่ระบุกลุ่ม') !== window._complianceSelectedGroup) return false;
    if (statusFilter && r.overall_status !== statusFilter) return false;
    const recs = window._complianceRecords[r.worker_id] || [];
    const courseNames = recs.map(rec => rec.courses?.course_name || rec.custom_course_name);
    const hay = [r.id_card, r.name, r.position_title, r.company, r.domicile, r.client_type, r.overall_status, groupSearchText(r.worker_id), ...courseNames];
    return chipsMatch('compliance', hay) && matchesQuery(hay, q);
  }).sort((a, b) => {
    const ra = a.employment_status === 'Resigned' ? 1 : 0, rb = b.employment_status === 'Resigned' ? 1 : 0;
    if (ra !== rb) return ra - rb; // active first, resigned last (list is already ordered by name)
    return 0;
  });
  const wrap = document.getElementById('compliance-cards');
  if (!wrap) return;
  if (!rows.length) {
    const filtered = (window._chips.compliance || []).length || (q || '').trim() || statusFilter;
    wrap.innerHTML = filtered
      ? NO_MATCH_HTML
      : `<div class="empty-state"><div class="t">ยังไม่มีข้อมูล</div><div class="d">ต้องผูกหลักสูตรบังคับต่อตำแหน่งก่อน (แท็บ “หลักสูตรบังคับต่อตำแหน่ง”)</div></div>`;
    return;
  }
  wrap.innerHTML = rows.map(r => {
    const wRecords = (window._complianceRecords[r.worker_id] || []);
    // mandatory / missing / expired come from the same server view that decides Complete vs Incomplete
    // (v_worker_training_gaps), so this can't disagree with the badge — including workers that hold more than one position
    const gap = (window._complianceGaps || {})[r.worker_id] || {};
    const mandIds = new Set(gap.mandatory_course_ids || []);
    const missingNames = gap.missing_courses || [];
    const expiredNames = gap.expired_courses || [];
    const attentionChips = (gap.attention || []).map(a => courseChip(a.name, a.expiry_date, a.sub)); // mandatory courses expiring soon / already expired
    const extras = wRecords.filter(x => !x.course_id || !mandIds.has(x.course_id));

    });
    const titleParts = [];

        ${attentionChips.length ? `<div><b style="font-size:11.5px;color:var(--grey-700);">⚠️ ใกล้หมดอายุ / หมดอายุแล้ว:</b><br>${attentionChips.join('')}</div>` : `<div class="cell-sub">ไม่มีหลักสูตรที่ใกล้หมดอายุหรือหมดอายุ</div>`}
      </div>

/* reusable worker identity block: ID / Name (bold) / Position / Dept | Province */
function identityBlockHtml(idCard, name, position, company, domicile) {
  return `
    <div class="cell-sub" style="font-size:10.5px;">${esc(idCard||'-')}</div>

    <div class="cell-sub">${esc(company||'-')} | ${esc(domicile||'-')}</div>`;

function courseChip(name, expiryDate, subOptions) {
  let text, cls;
  if (!expiryDate) { text = `${name} (N/A)`; cls = 'badge-neutral'; }
  else {
    const days = daysUntil(expiryDate);
    if (days < 0) { text = `${name} (หมดอายุแล้ว ${-days} วัน)`; cls = 'badge-bad'; }
    else if (days <= 90) { text = `${name} (เหลือ ${days} วัน)`; cls = 'badge-warn'; }
    else { text = `${name} (ยังใช้ได้ ${days} วัน)`; cls = 'badge-ok'; }
  }
  if (subOptions && subOptions.length) text += ` [${subOptions.map(s=>s.name).join(', ')}]`;
  return `<span class="badge ${cls}" style="margin:2px 5px 2px 0;">${esc(text)}</span>`;
}

async function openTrainingMatrixEditor(workerId) {
  let wRows, workerPosRows, mandLinksRaw, allRecords;
  try {
    wRows = await supa(`/rest/v1/v_workers_status?select=*&id=eq.${workerId}`);
    [workerPosRows, mandLinksRaw, allRecords] = await Promise.all([
    supa(`/rest/v1/worker_positions?select=position_id&worker_id=eq.${workerId}`),
    supa(`/rest/v1/position_mandatory_courses?select=position_id,course_id,client_tag,courses(id,course_name,has_sub_options,sub_options)&order=id.asc`),
    supa(`/rest/v1/worker_training_records?select=*&worker_id=eq.${workerId}`),
    ]);
  } catch (e) { toast('โหลดข้อมูลไม่สำเร็จ: ' + e.message, 'err'); return; }
  const w = wRows[0] || {};
  // only courses required for THIS worker's own position(s) + Group-derived client
  // tag — a shared position like Rigger/Scaffolder can carry Chevron + PTTEP
  // requirements at once, but a worker whose group maps to Chevron should not
  // see PTTEP-only ones (and vice versa); a worker can also hold >1 position
  const workerPositionIds = new Set(workerPosRows.map(r => r.position_id).filter(Boolean));
  if (!workerPositionIds.size && w.position_id) workerPositionIds.add(w.position_id);
  const workerClientTag = bigGroupToClientTag(bigGroupName(w.group_name));
  const mandLinksForClient = mandLinksRaw.filter(m =>
    workerPositionIds.has(m.position_id) && (!m.client_tag || m.client_tag === workerClientTag)
  );
  const seenCourseIds = new Set();
  const mandLinks = mandLinksForClient.filter(m => {
    if (seenCourseIds.has(m.course_id)) return false;
    seenCourseIds.add(m.course_id);
    return true;
  }); // natural order = position_mandatory_courses.id — the order courses were set up/ticked in "หลักสูตรบังคับต่อตำแหน่ง"
  window._tmeCourseOrder = mandLinks.map(m => m.course_id); // let the detail view mirror this exact order
  const mandIds = new Set(mandLinks.map(m => m.course_id));
  const recByCourse = {};
  allRecords.forEach(r => { if (r.course_id) recByCourse[r.course_id] = r; });
  const extraRecords = allRecords.filter(r => (!r.course_id || !mandIds.has(r.course_id)) && !r.plan_date);
  const confirmedRecords = allRecords.filter(r => r.plan_date);

  showModal('จัดการ Training Matrix — ' + esc(w.name||''), `
    <input type="hidden" id="tme-worker-id" value="${workerId}">
    <p class="cell-sub" style="margin-top:-6px;">${esc(w.position_title||'-')} — แก้ไขช่องที่ต้องการ แล้วกด “💾 บันทึกทั้งหมด” ด้านล่างครั้งเดียวตอนแก้เสร็จ (แถวที่แก้ไว้แต่ยังไม่บันทึกจะมีกรอบสีเหลือง)</p>
    <div class="form-section-title">ใบรับรอง (Certificates) — หลักสูตรบังคับตามตำแหน่ง (${mandLinks.length})</div>
    <div id="tme-certs">${mandLinks.map(m => certRowHtml(m.courses, recByCourse[m.course_id])).join('') || '<div class="cell-sub">ตำแหน่งนี้ยังไม่มีหลักสูตรบังคับ</div>'}</div>

    <div class="form-section-title" style="margin-top:20px;display:flex;justify-content:space-between;align-items:center;">
      <span>หลักสูตรเสริม (Additional Courses)</span>
      <button type="button" class="link-chip" onclick="addExtraRow()">➕ เพิ่มหลักสูตรเสริม</button>
    </div>
    <div id="tme-extras">${extraRecords.map(r => extraRowHtml(r)).join('') || ''}</div>

    <div class="form-section-title" style="margin-top:20px;display:flex;justify-content:space-between;align-items:center;">
      <span>Training Confirmed</span>
      <button type="button" class="link-chip" onclick="addConfirmedRow()">➕ เพิ่ม</button>
    </div>
    <div id="tme-confirmed">${confirmedRecords.map(r => confirmedRowHtml(r)).join('') || ''}</div>

    <button type="button" class="btn btn-primary" style="width:100%;margin-top:16px;position:sticky;bottom:0;" onclick="saveAllTmeRows(this)">💾 บันทึกทั้งหมด</button>
  `, 'lg');
}
async function saveAllTmeRows(btnEl) {
  const modal = btnEl.closest('.modal');
  const allDirtyRows = Array.from(modal.querySelectorAll('.tme-cert-row, .tme-extra-row, .tme-confirmed-row'))
    .filter(rowEl => rowEl.dataset.dirty === '1');
  const deleteRows = allDirtyRows.filter(rowEl => rowEl.dataset.pendingDelete === '1');
  const upsertRows = allDirtyRows.filter(rowEl => rowEl.dataset.pendingDelete !== '1');
  if (!allDirtyRows.length) { toast('ไม่มีข้อมูลที่แก้ไข'); return; }
  btnEl.disabled = true; btnEl.textContent = 'กำลังบันทึก...';
  let count = 0;
  for (const rowEl of upsertRows) {
    await upsertRow(rowEl);
    count++;
  }
  for (const rowEl of deleteRows) {
    try {
      await supa('/rest/v1/worker_training_records?id=eq.' + rowEl.dataset.recordId, { method: 'DELETE' });
      rowEl.remove();
      count++;
    } catch (e) { toast('ลบไม่สำเร็จ: ' + e.message, 'err'); }
  }
  btnEl.disabled = false; btnEl.textContent = '💾 บันทึกทั้งหมด';
  toast(`บันทึก ${count} รายการที่แก้ไขแล้ว`);
}

function deleteTmeRow(rowEl) {
  const recId = rowEl.dataset.recordId;
  if (!recId) { rowEl.remove(); return; } // brand new, never-saved row — nothing to preserve
  rowEl.dataset.pendingDelete = '1';
  rowEl.dataset.dirty = '1';
  rowEl.style.opacity = '0.45';
  rowEl.style.textDecoration = 'line-through';
  rowEl.querySelectorAll('input, select, textarea').forEach(el => el.disabled = true);
  rowEl.querySelectorAll('button').forEach(el => { if (!el.classList.contains('undo-delete-btn')) el.style.display = 'none'; });
  if (!rowEl.querySelector('.undo-delete-btn')) {
    const undoBtn = document.createElement('button');
    undoBtn.type = 'button';

    undoBtn.style.textDecoration = 'none';
    undoBtn.textContent = '↩️ ยกเลิกการลบ';
    undoBtn.onclick = () => restoreTmeRow(rowEl);
    rowEl.appendChild(undoBtn);
  }
  toast('ทำเครื่องหมายลบไว้แล้ว — ยังไม่ลบจริงจนกว่าจะกด "💾 บันทึกทั้งหมด" (กด "ยกเลิกการลบ" ได้ถ้าเปลี่ยนใจ)');
}
function restoreTmeRow(rowEl) {
  delete rowEl.dataset.pendingDelete;
  rowEl.style.opacity = '';
  rowEl.style.textDecoration = '';
  rowEl.querySelectorAll('input, select, textarea').forEach(el => el.disabled = false);
  rowEl.querySelectorAll('button').forEach(el => { el.style.display = ''; });

  if (undoBtn) undoBtn.remove();
  toast('ยกเลิกการลบแล้ว');
}

/* work rounds per worker, used to pick a training date that doesn't clash with work:
   last = most recent round that has started; future = rounds not started yet (soonest first) */
function buildRemindWorkMap(allocs) {
  const today = new Date().toISOString().slice(0, 10);
  const map = {};
  (allocs || []).forEach(a => {
    if (!a.mob_date) return;
    const w = (map[a.worker_id] = map[a.worker_id] || { last: null, future: [] });
    if (a.mob_date <= today) { if (!w.last || a.mob_date > w.last.mob_date) w.last = a; }
    else w.future.push(a);
  });
  Object.values(map).forEach(w => w.future.sort((x, y) => x.mob_date.localeCompare(y.mob_date)));
  return map;
}
function remindRoundHtml(a, today) {
  if (!a) return '<span class="cell-sub">-</span>';
  const working = a.mob_date <= today && (!a.demob_date || a.demob_date >= today);
  const where = [a.projects?.project_name, a.projects?.location].filter(Boolean).join(' · ');
  return `<div style="font-size:12.5px;">${fmtDate(a.mob_date)} – ${a.demob_date ? fmtDate(a.demob_date) : '-'}${working ? ' <span class="badge badge-warn">กำลังทำงาน</span>' : ''}</div>
    ${where ? `<div class="cell-sub">${esc(where)}</div>` : ''}`;
}
function remindWorkCellsHtml(workerId) {
  const today = new Date().toISOString().slice(0, 10);
  const w = (window._remindWork || {})[workerId] || { last: null, future: [] };
  const next = w.future[0];
  const more = w.future.length - 1;
  const allFuture = w.future.map(a => `${fmtDate(a.mob_date)} – ${a.demob_date ? fmtDate(a.demob_date) : '-'}`).join(' | ');
  return `<td style="white-space:normal;min-width:140px;max-width:185px;">${remindRoundHtml(w.last, today)}</td>
      <td style="white-space:normal;min-width:140px;max-width:185px;"${more > 0 ? ` title="${esc(allFuture)}"` : ''}>${next ? remindRoundHtml(next, today) + (more > 0 ? `<div class="cell-sub">และอีก ${more} รอบ (วางเมาส์ดู)</div>` : '') : '<span class="cell-sub">ยังไม่มีแผน</span>'}</td>`;
}
async function paintRemind(body) {
  const [rows, allocs, groupRows, recCourses, gaps] = await Promise.all([
    supa('/rest/v1/v_training_reminders?select=*'),
    supaAll('/rest/v1/worker_project_allocations?select=worker_id,mob_date,demob_date,projects(project_name,location)&order=mob_date.desc'),
    supa('/rest/v1/workers?select=id,group_name'),
    supaAll('/rest/v1/worker_training_records?select=id,course_id'),
    supaAll('/rest/v1/v_worker_training_gaps?select=worker_id,mandatory_course_ids'),
  ]);
  rememberWorkerGroups(groupRows);
  // mandatory (เซอร์บังคับ) = the course is required for this worker's position(s) — same rule as the Excel summary
  const courseOfRecord = {}; (recCourses || []).forEach(r => { courseOfRecord[r.id] = r.course_id; });
  const mandOf = {}; (gaps || []).forEach(g => { mandOf[g.worker_id] = new Set((g.mandatory_course_ids || []).map(String)); });
  rows.forEach(r => {
    const cid = courseOfRecord[r.training_record_id];
    r._mandatory = cid != null && !!mandOf[r.worker_id]?.has(String(cid));
  });
  window._remindRows = rows;
  window._remindWork = buildRemindWorkMap(allocs);
  body.innerHTML = `
    <div class="toolbar">${chipSearchHtml('remind')}</div>
    <div class="table-wrap remind-wrap"><table>
      <thead><tr><th>พนักงาน</th><th>หลักสูตร</th><th>Status</th><th>รอบลงทำงานล่าสุด</th><th>แผนลงทำงานอนาคต</th><th>วันหมดอายุ</th><th>เหลือกี่วัน</th><th>แผนอบรม</th><th></th></tr></thead>
      <tbody id="remind-tbody"></tbody>
    </table></div>`;
  initChipSearch('remind');
  paintRemindFilter('');
}
function paintRemindFilter(q) {
  const rows = (window._remindRows||[]).filter(r => {
    const hay = [r.id_card, r.worker_name, r.position_title, r.company, r.domicile, r.course_name, r.location, r.remark, groupSearchText(r.worker_id),
      r._mandatory ? 'เซอร์บังคับ mandatory' : 'เซอร์เสริม extra'];
    return chipsMatch('remind', hay) && matchesQuery(hay, q);
  });
  const tbody = document.getElementById('remind-tbody');

function buildFutureTrainingData({ records, workers, phones, gaps, from, to, groups, includeOther, courses, workerPositions, equivs }) {
  const wMap = {}; workers.forEach(w => { wMap[w.id] = w; });
  const phoneMap = {}; phones.forEach(p => { if (p.phone_number) phoneMap[p.id] = p.phone_number; });
  const mandMap = {}; gaps.forEach(g => { mandMap[g.worker_id] = new Set(g.mandatory_course_ids || []); });
  const keyOf = r => r.worker_id + '|' + (r.course_id != null ? 'c' + r.course_id : 'n' + (r.custom_course_name || '').trim().toLowerCase());
  // latest expiry per worker+course (a record with an issue date but no expiry never expires)
  const latest = {};
  records.forEach(r => {
    const v = r.expiry_date ? r.expiry_date : (r.issue_date ? '9999-12-31' : '');
    const k = keyOf(r);
    if (v && (!latest[k] || v > latest[k])) latest[k] = v;
  });
  const wanted = w => { // only the sides / groups ticked in the picker
    const g = (w.group_name || '').trim();
    return FTS_SIDES.some(([, gs]) => gs.includes(g)) ? (!groups || groups.has(g)) : (includeOther !== false);
  };
  const seen = new Set(); const mandatory = []; const extra = [];
  records.forEach(r => {
    if (!r.expiry_date || r.expiry_date < from || r.expiry_date > to) return;
    const w = wMap[r.worker_id];
    if (!w || w.employment_status === 'Resigned' || !wanted(w)) return;
    const k = keyOf(r);
    if (latest[k] !== r.expiry_date || seen.has(k)) return; // already replaced by a newer certificate / duplicate
    seen.add(k);
    const row = { worker: w.name || '', idCard: w.id_card || '', position: w.position_title || '',
      side: ftsSideOf(w.group_name), group: (w.group_name || '').trim() || 'ไม่ระบุ',
      phone: phoneMap[w.id] || '', course: r.courses?.course_name || r.custom_course_name || '-',
      issue: r.issue_date, expiry: r.expiry_date, plan: r.plan_date, planEnd: r.plan_end_date };
    ((r.course_id && (mandMap[r.worker_id] || new Set()).has(r.course_id)) ? mandatory : extra).push(row);

/* data for the "find who still needs a course" block under the extra-certificate table:

function buildFtsFinderData({ records, workers, phoneMap, wanted, courses, workerPositions, equivs }) {
  const clean = v => String(v || '').replace(/\s+/g, ' ').trim();
  const people = workers.filter(w => w.employment_status !== 'Resigned' && wanted(w));
  const inScope = new Set(people.map(w => w.id));
  const posMap = {};
  people.forEach(w => { posMap[w.id] = []; const p = clean(w.position_title); if (p) posMap[w.id].push(p); });
  (workerPositions || []).forEach(x => { const t = clean(x.positions?.title); if (t && posMap[x.worker_id] && !posMap[x.worker_id].includes(t)) posMap[x.worker_id].push(t); });
  const courseName = {}; (courses || []).forEach(c => { courseName[c.id] = clean(c.course_name); });
  const equivMap = {}; // a Chevron course and its PTTEP twin count as the same certificate
  (equivs || []).forEach(e => { [[e.chevron_course_id, e.pttep_course_id], [e.pttep_course_id, e.chevron_course_id]].forEach(([a, b]) => { if (a && b) (equivMap[a] = equivMap[a] || new Set()).add(b); }); });
  const latest = {}; // worker|course name (lower case) -> latest certificate
  const put = (wid, name, r, exp) => {
    if (!name) return; const k = wid + '|' + name.toLowerCase();
    if (!latest[k] || exp > latest[k].exp) latest[k] = { wid, name, exp, issue: r.issue_date, plan: r.plan_date, planEnd: r.plan_end_date };
  };
  records.forEach(r => {
    if (!inScope.has(r.worker_id)) return;
    const exp = r.expiry_date ? r.expiry_date : (r.issue_date ? '9999-12-31' : '');
    if (!exp) return;
    const own = r.course_id != null ? (courseName[r.course_id] || clean(r.courses?.course_name)) : clean(r.custom_course_name);
    put(r.worker_id, own, r, exp);
    if (r.course_id != null) (equivMap[r.course_id] || []).forEach(id => put(r.worker_id, courseName[id], r, exp));
  });
  const seenCourse = new Set();
  const courseList = (courses || []).filter(c => clean(c.course_name))
    .map(c => ({ name: clean(c.course_name), scope: clean(c.client_scope) || 'อื่นๆ', order: c.sort_order ?? 9999 }))
    .sort((a, b) => a.scope.localeCompare(b.scope) || a.order - b.order || a.name.localeCompare(b.name))
    .filter(c => { const k = c.scope + '|' + c.name.toLowerCase(); if (seenCourse.has(k)) return false; seenCourse.add(k); return true; });
  const rows = people.map(w => ({ id: w.id, name: w.name || '', idCard: w.id_card || '', positions: posMap[w.id],
      side: ftsSideOf(w.group_name), group: clean(w.group_name) || 'ไม่ระบุ', phone: phoneMap[w.id] || '' }))

}

  // ---- "Require เพิ่มเติม": pick group / position / course -> everyone who doesn't have that course

  const addFinder = (ws, f, top) => {

    const cLast = certs.length + 1, ck = `$P$2:$P$${cLast}`;

    // groups and the course side each one uses (Chevron groups → Chevron courses; any other group → every course)
    const scopes = new Set(f.courseList.map(c => c.scope));
    const groupsHere = [...new Set(f.rows.map(x => x.group))];
    const groupRows = [[ALL, '*'], ...groupsHere.map(g => [g, scopes.has(ftsSideOf(g)) ? ftsSideOf(g) : '*'])];
    groupRows.forEach(([g, sc], i) => { lk.getCell(i + 2, 24).value = g; lk.getCell(i + 2, 26).value = sc; });
    const gl = groupRows.length + 1;

    const label = (col, span, text) => { ws.mergeCells(labRow, col, labRow, col + span - 1); const c = ws.getCell(labRow, col); c.value = text; c.font = { name: FONT, bold: true, size: 10.5 }; c.alignment = { horizontal: 'center', wrapText: true }; };
    label(2, 2, 'เลือกกรุ๊ป'); label(4, 5, `เลือกตำแหน่ง (เลือกได้ ${NP} ตำแหน่ง · เว้นว่าง = ทุกตำแหน่ง)`); label(9, 4, 'เลือกหลักสูตร (พิมพ์ตัวอักษรแรกเพื่อค้นหาได้)');
